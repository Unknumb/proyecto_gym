# =============================================================================
# Catálogo de datos — Gym Exercises EDA
# =============================================================================

# ── Capa 01: Raw ─────────────────────────────────────────────────────────────
raw_exercises_data:
  type: pandas.JSONDataset
  filepath: data/01_raw/exercises.json
  load_args:
    # Sin esto, pandas infiere `id` y `media_id` como enteros y destruye los
    # ceros a la izquierda ("0001" -> 1), rompiendo la llave hacia `gif_url`
    # y `media_id`. La corrupción ocurre en la carga, antes de cualquier
    # transformación, así que se corrige en el origen.
    dtype:
      id: str
      media_id: str

# ── Capa 02: Intermediate ────────────────────────────────────────────────────
intermediate_exercises_clean:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/exercises_clean.parquet

# ── Capa 08: Reporting ───────────────────────────────────────────────────────
eda_summary_report:
  type: pandas.CSVDataset
  filepath: data/08_reporting/eda_summary.csv

distribution_metrics:
  type: pandas.CSVDataset
  filepath: data/08_reporting/distribution_metrics.csv

# ── IE3: Tabla analítica y salidas del EDA diagnóstico ───────────────────────
# Se usa Parquet (columnar binario) en la capa intermedia para mantener el
# footprint bajo y preservar los dtypes, según la restricción FinOps.
intermediate_exercise_features:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/exercise_features.parquet

outliers_iqr_report:
  type: pandas.CSVDataset
  filepath: data/08_reporting/outliers_iqr.csv

shape_statistics_report:
  type: pandas.CSVDataset
  filepath: data/08_reporting/shape_statistics.csv

correlation_matrix_report:
  type: pandas.CSVDataset
  filepath: data/08_reporting/correlation_matrix.csv

# ── Auditoría de recursos cinemáticos ────────────────────────────────────────
media_references_report:
  type: pandas.CSVDataset
  filepath: data/08_reporting/media_references_audit.csv

# Producido por scripts/auditar_media_fisica.py (requiere red; se ejecuta aparte
# para que el pipeline y el notebook sigan siendo reproducibles sin conexión).
media_sample_audit:
  type: pandas.CSVDataset
  filepath: data/08_reporting/media_sample_audit.csv

# ── Mapeo músculo → articulación (prerrequisito del grafo, README §6.2) ─────
# Producido por scripts/construir_mapeo_articulaciones.py (requiere red para el
# contraste de Wikipedia; ExRx.net se cura a mano, ver docstring del script).
musculo_articulacion_manual:
  type: pandas.CSVDataset
  filepath: data/01_raw/musculo_articulacion_manual.csv

cobertura_articulaciones:
  type: pandas.CSVDataset
  filepath: data/08_reporting/cobertura_articulaciones.csv
  save_args:
    index: true

# ── Enriquecimiento con megaGymDataset (Kaggle, CC0) — README §2.1 y §3.5 ────
# Aporta nivel de dificultad, tipo y valoración, que el catálogo base no trae.
raw_megagym_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/megaGymDataset.csv
  load_args:
    index_col: 0          # la primera columna es el índice exportado por pandas

intermediate_megagym:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/megagym.parquet

# Una fila por ejercicio: candidato, puntajes, coherencia y decisión. Se deja en
# CSV para que el emparejamiento se pueda auditar a simple vista.
megagym_match_report:
  type: pandas.CSVDataset
  filepath: data/08_reporting/megagym_match_audit.csv
  load_args:
    dtype:
      id: str             # mismo defecto de §3.3: sin esto "0001" vuelve como 1

primary_exercise_features_enriched:
  type: pandas.ParquetDataset
  filepath: data/03_primary/exercise_features_enriched.parquet

# Muestra de pares nombre ↔ título revisada a mano (mismo / variante / distinto)
# para estimar la precisión de cada método de emparejamiento. Es curación, no
# salida del pipeline: por eso vive en 01_raw, igual que el mapeo articular.
megagym_match_validacion:
  type: pandas.CSVDataset
  filepath: data/01_raw/megagym_match_validacion_manual.csv
  load_args:
    dtype:
      id: str

# ── EV2: Integración de fuentes (pipeline integracion_fuentes) ───────────────
# Instantáneas producidas por scripts/descargar_fuentes_externas.py (requiere
# red); el commit y la fecha exactos quedan en fuentes_externas_manifest.json.
raw_free_exercise_db:
  type: pandas.JSONDataset
  filepath: data/01_raw/free_exercise_db.json
  load_args:
    dtype: {id: str}

raw_wger:
  type: pandas.JSONDataset
  filepath: data/01_raw/wger_exercises.json

# Curación manual de la ontología (README §6.2): vocabulario, articulaciones,
# regiones compuestas y familias de equipamiento.
vocabulario_muscular_externo:
  type: pandas.CSVDataset
  filepath: data/01_raw/vocabulario_muscular_externo.csv

articulaciones_canonicas:
  type: pandas.CSVDataset
  filepath: data/01_raw/articulaciones_canonicas.csv

regiones_compuestas:
  type: pandas.CSVDataset
  filepath: data/01_raw/regiones_compuestas.csv

equipamiento_canonico:
  type: pandas.CSVDataset
  filepath: data/01_raw/equipamiento_canonico.csv

vocabulario_muscular:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/vocabulario_muscular.csv

intermediate_catalogo_unificado:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/catalogo_unificado.parquet

intermediate_free_exercise_db:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/free_exercise_db.parquet

intermediate_wger:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/wger.parquet

match_free_exercise_db_report:
  type: pandas.CSVDataset
  filepath: data/08_reporting/match_free_exercise_db.csv

match_wger_report:
  type: pandas.CSVDataset
  filepath: data/08_reporting/match_wger.csv

# Base del grafo biomecánico: nodos Ejercicio y aristas Ejercicio→Músculo y
# Músculo→Articulación.
primary_ejercicios:
  type: pandas.ParquetDataset
  filepath: data/03_primary/ejercicios.parquet

primary_ejercicio_musculo:
  type: pandas.ParquetDataset
  filepath: data/03_primary/ejercicio_musculo.parquet

primary_musculo_articulacion:
  type: pandas.CSVDataset
  filepath: data/03_primary/musculo_articulacion.csv

integracion_fuentes_resumen:
  type: pandas.CSVDataset
  filepath: data/08_reporting/integracion_fuentes_resumen.csv

# Muestra de pares difusos revisada a mano (mismo / variante / distinto), mismo
# protocolo que megagym_match_validacion.
fuentes_match_validacion:
  type: pandas.CSVDataset
  filepath: data/01_raw/fuentes_match_validacion_manual.csv

# ── EV2: Modelado supervisado (pipeline modelado_supervisado) ────────────────
model_input_tabla_modelado:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/tabla_modelado.parquet

# Por objetivo: estimador final (reentrenado con todo free-exercise-db), modelo
# entrenado solo con train (para interpretar en test), umbral de abstención.
modelos_supervisados:
  type: pickle.PickleDataset
  filepath: models/modelos_supervisados.pkl
  backend: joblib

modelos_comparacion:
  type: pandas.CSVDataset
  filepath: data/08_reporting/modelos_comparacion.csv

modelos_predicciones_test:
  type: pandas.CSVDataset
  filepath: data/08_reporting/modelos_predicciones_test.csv

model_output_perfil_exigencia:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/perfil_exigencia.parquet

# ── EV2: Grafo biomecánico no supervisado (pipeline grafo_biomecanico) ───────
grafo_biomecanico:
  type: pickle.PickleDataset
  filepath: models/grafo_biomecanico.pkl

# Una fila por ejercicio del grafo: perfil de exigencia, músculos expandidos y
# articulaciones que carga.
grafo_nodos_ejercicio:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/grafo_nodos_ejercicio.parquet

embeddings_node2vec:
  type: pandas.ParquetDataset
  filepath: models/embeddings_node2vec.parquet

comunidades_louvain:
  type: MemoryDataset

clusters_kmeans:
  type: MemoryDataset

louvain_barrido:
  type: pandas.CSVDataset
  filepath: data/08_reporting/louvain_barrido.csv

kmeans_barrido:
  type: pandas.CSVDataset
  filepath: data/08_reporting/kmeans_barrido.csv

# Familia de movimiento de cada ejercicio según los dos métodos, con UMAP.
model_output_familias_movimiento:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/familias_movimiento.parquet

familias_perfiles:
  type: pandas.CSVDataset
  filepath: data/08_reporting/familias_perfiles.csv

clustering_comparacion:
  type: pandas.CSVDataset
  filepath: data/08_reporting/clustering_comparacion.csv

sustitucion_cobertura:
  type: pandas.CSVDataset
  filepath: data/08_reporting/sustitucion_cobertura.csv

sustitucion_contexto:
  type: pandas.CSVDataset
  filepath: data/08_reporting/sustitucion_contexto.csv
