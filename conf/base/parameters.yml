# =============================================================================
# Parámetros del proyecto — Gym Exercises EDA
# =============================================================================
# Agrega aquí parámetros compartidos entre pipelines.

# Emparejamiento por nombre entre el catálogo y megaGymDataset (README §3.5).
# Un par difuso se acepta si supera AMBOS umbrales y además es coherente en
# región muscular y equipamiento. Se prefiere perder cobertura antes que
# transferir un nivel de dificultad desde el ejercicio equivocado.
emparejamiento_megagym:
  umbral_similitud: 85    # token_sort_ratio (0-100) sobre nombres normalizados
  umbral_jaccard: 0.5     # solapamiento de tokens, estrictamente mayor que

# Emparejamiento entre el catálogo, free-exercise-db y wger (pipeline
# integracion_fuentes). Mismos umbrales que megaGymDataset; la coherencia se
# mide por articulación de los agonistas y familia de equipamiento.
emparejamiento_fuentes:
  umbral_similitud: 85
  umbral_jaccard: 0.5

# Modelado supervisado del perfil de exigencia (docs/plan_ev2.md, fase 2).
modelado_supervisado:
  semilla: 2026
  umbral_variantes: 85            # token_sort_ratio para agrupar variantes casi idénticas
  proporcion_test: 0.2            # fracción de grupos reservada para prueba
  n_folds: 5                      # GroupKFold dentro de train
  # Acierto mínimo, fuera de muestra en free-exercise-db, de lo que el modelo sí
  # etiqueta. Es 0.95 y no 0.90 porque la validación externa mide una caída de
  # 4-5 puntos al pasar al catálogo (otra redacción y otro vocabulario).
  precision_objetivo_abstencion: 0.95
  n_arboles: 400
  # Si queda a menos de 1 error estándar del mejor en CV, gana el más simple.
  modelo_preferido_en_empate: regresion_logistica
  grilla_logistica:
    C: [0.1, 0.3, 1.0, 3.0, 10.0, 30.0, 100.0, 300.0, 1000.0]   # elegido con la regla de 1 error estándar
  grilla_random_forest:
    max_depth: [null, 30]
    min_samples_leaf: [1, 3]
    max_features: [sqrt, 0.1]
