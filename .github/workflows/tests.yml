name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Instalar dependencias (versiones fijadas)
        run: pip install -r requirements-lock.txt
      - name: Tests unitarios, de datos y de modelo
        run: python -m pytest -q

  # App de iPhone (ios/): misma predicción que scikit-learn y que la app compile.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Paridad del modelo en Swift con scikit-learn
        working-directory: ios/SustitutoSeguroCore
        run: swift run -c release verificar
      - name: Tests de Swift
        working-directory: ios/SustitutoSeguroCore
        run: swift test
      - name: Compilar la app para el simulador de iPhone
        run: |
          set -o pipefail
          xcodebuild -project ios/SustitutoSeguro/SustitutoSeguro.xcodeproj -scheme SustitutoSeguro \
            -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO build | tail -25
      - name: La app lleva el modelo y las recomendaciones en la raíz del paquete
        run: |
          app="build-ios/Build/Products/Debug-iphonesimulator/Sustituto Seguro.app"
          for archivo in modelo_perfil.json recomendaciones.json; do
            test -f "$app/$archivo" || { echo "Falta $archivo en la raíz de la app"; ls -R "$app" | head -40; exit 1; }
          done
