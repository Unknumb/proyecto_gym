<title>Sustituto Seguro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de una columna con barra de pestañas fija (abajo en móvil, arriba en escritorio).
   Tema oscuro deliberado: sala de entrenamiento de noche, teal clínico del proyecto + ámbar de esfuerzo. */
:root {
  --bg: #0A1114;
  --surface: #111B1F;
  --surface-2: #172429;
  --line: #22353A;
  --fg: #E6EEF0;
  --muted: #8FA4A9;
  --accent: #3CC0B2;
  --accent-ink: #062521;
  --accent-soft: #123430;
  --amber: #EBA845;
  --amber-soft: #3A2C14;
  --veto: #F07A6E;
  --veto-soft: #3C1D1A;
  --ok: #62CC8E;
  --display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --tabbar: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--fg); font-family: var(--body); font-size: 1rem; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(var(--tabbar) + 24px + env(safe-area-inset-bottom, 0px));
}
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 900px; margin: 0 auto; padding-block: 20px 24px; }
.vista { display: grid; gap: 22px; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.eyebrow { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); }
.num-tab { font-variant-numeric: tabular-nums; }

/* Barra de pestañas */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: center;
}
nav.tabs .in { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; width: 100%; max-width: 760px; }
nav.tabs a {
  display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px;
  color: var(--muted); text-decoration: none; font-size: 0.74rem; font-weight: 600;
}
nav.tabs a svg { width: 22px; height: 22px; }
nav.tabs a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
@media (min-width: 760px) {
  body { padding-bottom: 32px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
  nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
  nav.tabs .in { grid-template-columns: repeat(6, auto); justify-content: center; gap: 6px; }
  nav.tabs a { grid-auto-flow: column; gap: 8px; padding: 8px 14px; font-size: 0.92rem; }
  nav.tabs a svg { width: 18px; height: 18px; }
}

/* Componentes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.card.plain { background: transparent; border-style: dashed; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 16px; font-weight: 600;
  text-decoration: none; color: var(--fg);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--veto); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 0.95rem;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip.veto[aria-pressed="true"] { background: var(--veto-soft); border-color: var(--veto); color: var(--veto); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; }
.chip[aria-pressed="true"] .dot { background: currentColor; }
.pill { font-size: 0.78rem; border-radius: 999px; padding: 2px 10px; white-space: nowrap; height: fit-content; font-weight: 600; }
.pill.teal { background: var(--accent-soft); color: var(--accent); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.red { background: var(--veto-soft); color: var(--veto); }
.aviso { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 12px 14px; font-size: 0.94rem; }
.aviso.amber { background: var(--amber-soft); } .aviso.amber b { color: var(--amber); }
.aviso.red { background: var(--veto-soft); } .aviso.red b { color: var(--veto); }
.aviso.teal { background: var(--accent-soft); } .aviso.teal b { color: var(--accent); }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .lbl { font-weight: 600; font-size: 0.93rem; }
.field input, .field select, textarea {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2);
}
.field input:focus, .field select:focus, textarea:focus { border-color: var(--accent); outline: none; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface-2); gap: 2px; }
.seg button { border: 0; background: none; padding: 7px 13px; border-radius: 7px; cursor: pointer; font-size: 0.93rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* Inicio */
.hero { display: grid; gap: 12px; padding-top: 8px; }
.hero h1 { font-size: clamp(2.1rem, 7vw, 3.4rem); line-height: 1.02; font-weight: 700; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lead { color: var(--muted); max-width: 58ch; font-size: 1.08rem; }
.entradas { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.entrada {
  display: grid; gap: 8px; align-content: start; padding: 18px; border-radius: 14px; text-decoration: none; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); transition: border-color .15s, transform .15s;
}
.entrada:hover { border-color: var(--accent); transform: translateY(-2px); }
.entrada .ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.entrada h3 { font-size: 1.15rem; }
.entrada p { color: var(--muted); font-size: 0.94rem; }
.resumen-inicio { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 2px; }
.kpi .v { font-family: var(--display); font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 0.85rem; }

/* Sustituir */
.buscador { position: relative; }
.buscador input { width: 100%; font-size: 1.05rem; padding: 13px 14px 13px 42px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); }
.buscador input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.buscador svg { position: absolute; left: 14px; top: 24px; transform: translateY(-50%); color: var(--muted); }
.sugerencias { list-style: none; margin: 6px 0 0; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: grid; max-height: 320px; overflow-y: auto; }
.sugerencias button { width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
.sugerencias button:hover, .sugerencias button[aria-selected="true"] { background: var(--accent-soft); }
.sugerencias .meta { color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.sugerencias .vacio { padding: 10px; color: var(--muted); }
.nombre { text-transform: none; }
.nombre .en { display: block; font-family: var(--body); font-weight: 400; color: var(--muted); font-size: 0.82rem; text-transform: capitalize; letter-spacing: 0; }
.ficha-h h3 { font-size: 1.4rem; overflow-wrap: anywhere; }
.datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 20px; margin: 0; }
.dato { min-width: 0; }
.dato dt { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.dato dd { margin: 2px 0 0; }
.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: alt; }
.alt { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 2.2rem 1fr; gap: 4px 12px; counter-increment: alt; }
.alt::before { content: counter(alt); grid-row: 1 / span 3; font-family: var(--display); font-weight: 700; font-size: 1.5rem; color: var(--accent); line-height: 1.2; }
.alt-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; min-width: 0; }
.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-weight: 600; font-size: 1.06rem; min-width: 0; overflow-wrap: anywhere; color: var(--fg); }
.linkbtn:hover { color: var(--accent); }
.alt-pie { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; min-width: 0; font-size: 0.9rem; }
.parecido { display: inline-flex; gap: 3px; align-items: center; color: var(--muted); }
.parecido i { width: 7px; height: 12px; border-radius: 2px; background: var(--line); }
.parecido i.on { background: var(--accent); }
.porque { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; color: var(--fg); }

/* Rutina */
.pasos-form { display: grid; gap: 18px; }
.dia { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.dia-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; padding: 14px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.dia-h h3 { font-size: 1.15rem; }
.ejs { list-style: none; margin: 0; padding: 0; }
.ej { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.ej:last-child { border-bottom: 0; }
.ej .pres { font-family: var(--mono); font-size: 0.85rem; color: var(--amber); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ej .sub { grid-column: 1 / -1; color: var(--muted); font-size: 0.86rem; }
.ej.extra { background: color-mix(in srgb, var(--amber-soft) 45%, transparent); }
.notas-rutina { display: grid; gap: 8px; padding-left: 1.1rem; margin: 0; color: var(--muted); }
.notas-rutina b { color: var(--fg); }
.ia { border: 1px solid var(--accent); background: linear-gradient(160deg, var(--accent-soft), var(--surface) 60%); }
.ia-out { white-space: pre-wrap; line-height: 1.55; }
.cambio { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.cambio input { margin-top: 5px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }

/* Entrenar */
.serie { display: grid; grid-template-columns: 2rem 1fr 1fr 2.8rem; gap: 8px; align-items: center; }
.serie .n { font-family: var(--mono); color: var(--muted); font-size: 0.85rem; }
.serie input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface-2); text-align: center; font-variant-numeric: tabular-nums; }
.serie input:focus { border-color: var(--accent); outline: none; }
.check { width: 2.8rem; height: 2.4rem; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface-2); cursor: pointer; display: grid; place-items: center; }
.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #062014; }
.serie.hecha input { color: var(--muted); }
.serie-h { display: grid; grid-template-columns: 2rem 1fr 1fr 2.8rem; gap: 8px; font-family: var(--mono); font-size: 0.7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; }
.barra-prog { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.barra-prog i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.timer {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px)); z-index: 25;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--amber); color: #241703; display: flex; justify-content: center;
}
.timer .in { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; width: 100%; max-width: 860px; }
.timer .t { font-family: var(--mono); font-size: 1.6rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.timer button { border: 1.5px solid #241703; background: transparent; color: #241703; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 700; }
@media (min-width: 760px) { .timer { bottom: 0; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); } }
input[type=range] { width: 100%; accent-color: var(--accent); }
.slider-row { display: grid; grid-template-columns: minmax(110px, 1fr) 2fr 2.4rem; gap: 10px; align-items: center; }
.slider-row output { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

/* Progreso */
.graf { width: 100%; height: auto; display: block; }
.graf text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
.historial { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.historial li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--muted); }
.leyenda span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: -1px; }

/* Cómo funciona */
.como-pasos { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: p; }
.como-pasos li { display: grid; grid-template-columns: 2.4rem 1fr; gap: 4px 14px; counter-increment: p; }
.como-pasos li::before { content: counter(p); grid-row: 1 / span 2; width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--accent); color: var(--accent); font-family: var(--mono); font-size: 0.9rem; }
.como-pasos h3 { font-size: 1.08rem; }
.como-pasos p { color: var(--muted); }
details { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 16px; }
details summary { cursor: pointer; padding: 14px 0; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details summary::after { content: "+"; color: var(--accent); font-family: var(--mono); }
details[open] summary::after { content: "–"; }
details > div { padding-bottom: 14px; color: var(--muted); display: grid; gap: 8px; }
/* Qué trabaja cada ejercicio */
.trabajo { display: grid; gap: 12px; color: var(--fg); }
.trabajo .lbl-mini { display: block; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.estructuras, .perfil-mov { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.estructuras li { display: grid; gap: 1px; }
.estructuras li span { font-size: 0.88rem; }
.perfil-mov li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; align-items: baseline; }
.perfil-mov .que { color: var(--muted); font-size: 0.88rem; }
details.mini { border: 0; background: none; padding: 0; grid-column: 1 / -1; }
details.mini > summary { padding: 4px 0; font-weight: 600; font-size: 0.9rem; color: var(--accent); justify-content: flex-start; }
details.mini > summary::after { margin-left: 6px; }
details.mini > div { padding: 8px 0 4px; color: var(--fg); }
details.corregir { background: var(--surface-2); }
.califica { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; grid-column: 2; font-size: 0.88rem; }
.califica button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: 0.85rem; }
.califica button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.califica button[data-v="inseguro"][aria-pressed="true"], .califica button[data-v="malo"][aria-pressed="true"] { background: var(--veto-soft); border-color: var(--veto); color: var(--veto); }
.alt details.mini { grid-column: 2; }
/* El modelo por dentro */
.tabla { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.tabla th, .tabla td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabla th { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.tabla td.n, .tabla th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tabla tr.actual td { color: var(--accent); font-weight: 600; }
.scroll-x { overflow-x: auto; }
.criterios { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.criterios li { display: grid; grid-template-columns: 1.6rem 1fr auto; gap: 10px; align-items: baseline; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.criterios .si { color: var(--ok); font-weight: 700; } .criterios .no { color: var(--veto); font-weight: 700; }
.criterios .v { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.graf .eje { fill: var(--muted); }
.paso-datos { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-top: 6px; }
.modelos-lista { display: grid; gap: 10px; }
.modelo-fila { display: grid; grid-template-columns: minmax(180px, 1.1fr) minmax(200px, 1.6fr) auto; gap: 8px 18px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
.modelo-fila .f1 { text-align: right; white-space: nowrap; }
.modelo-fila .f1 .v { font-family: var(--display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.barra-clases { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); }
.barra-clases i { display: block; height: 100%; }
@media (max-width: 640px) { .modelo-fila { grid-template-columns: 1fr; } .modelo-fila .f1 { text-align: left; } }
.graf text.fuerte { fill: var(--fg); font-weight: 600; }
footer { color: var(--muted); font-size: 0.84rem; display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 18px; margin-top: 28px; }

@media (max-width: 480px) {
  .card { padding: 14px; }
  .alt { grid-template-columns: 1.6rem 1fr; padding: 12px; }
  .ej { grid-template-columns: 1fr; }
  .ej .pres { text-align: left; }
  .slider-row { grid-template-columns: 1fr 2.4rem; }
  .slider-row label { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* Cuenta (README §20) */
.cuenta-barra { display: flex; justify-content: flex-end; padding-top: 12px; margin-bottom: -6px; }
.cuenta-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
.cuenta-chip:hover { border-color: var(--accent); }
.cuenta-chip .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.cuenta-chip.activa .punto { background: var(--ok); }
.cuenta-chip.error .punto { background: var(--amber); }

    'trapezius': 'trapecio', 'triceps': 'tríceps', 'upper back': 'espalda alta', 'upper chest': 'pecho superior',
    'wrist extensors': 'extensores de muñeca', 'wrist flexors': 'flexores de muñeca'
  };
  const EQUIPO = { 'asistido': 'Asistido', 'balon o rodillo': 'Balón o rodillo', 'banda elastica': 'Banda elástica', 'cable': 'Polea',
    'maquina': 'Máquina', 'maquina de cardio': 'Máquina de cardio', 'otro': 'Otro', 'peso corporal': 'Peso corporal', 'peso libre': 'Peso libre' };

  const A = Object.fromEntries(D.articulaciones.map((a, k) => [a, k]));
  const nomArt = k => ARTIC[D.articulaciones[k]] || D.articulaciones[k];
  const musculos = ids => ids.map(m => MUSCULO[D.musculos[m]] || D.musculos[m]).join(', ');
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const tiene = (obj, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(obj, k);

  // Perfil del movimiento: lo que predicen los modelos supervisados (README §12)
  const OBJ = ['mecanica', 'fuerza', 'complejidad_tecnica'];
  const OBJ_NOMBRE = { mecanica: 'Mecánica', fuerza: 'Tipo de fuerza', complejidad_tecnica: 'Complejidad técnica' };

  const ORIGEN = { f: ['Dato de la fuente', 'teal'], t: ['De un ejercicio gemelo', 'teal'], m: ['Predicho por el modelo', 'amber'], u: ['Aportado por usuarios', 'teal'] };
  const ORIGEN_PIPELINE = { f: 'fuente', t: 'transferida', m: 'modelo', u: 'usuarios' };
  // Ligamentos y tendones principales de cada articulación: referencia anatómica general, no medida por ejercicio
  const ESTRUCTURAS = {
    'cadera': 'ligamentos iliofemoral, isquiofemoral y pubofemoral; labrum de la cadera',
    'rodilla': 'ligamentos cruzados anterior (LCA) y posterior (LCP), colaterales medial y lateral, meniscos y tendón rotuliano',
    'tobillo': 'ligamentos laterales (peroneoastragalinos), ligamento deltoideo y tendón de Aquiles',
    'pie (intertarsal)': 'fascia plantar y ligamentos del arco del pie',
    'hombro': 'tendones del manguito rotador, ligamentos glenohumerales y labrum',
    'escapulotorácica': 'sin ligamentos propios: la sostienen músculos (serrato anterior, trapecio y romboides)',
    'codo': 'ligamentos colaterales cubital y radial, y tendones de los epicóndilos',

    'muñeca': 'ligamentos radiocarpianos, ligamento escafolunar y fibrocartílago triangular',
    'muñeca/dedos': 'tendones flexores y extensores de los dedos y sus poleas',

  const perfilDe = i => D.ejercicios[i][11] || [];
  const claseEs = (o, k) => k >= 0 ? (CLASE_ES[D.clases[o][k]] || D.clases[o][k]) : '';

  // Lesiones tal como las entiende una persona → articulaciones del modelo (criterio conservador)
  const LESIONES = [
    ['hombro', 'Hombro', ['hombro', 'escapulotorácica']],

    ['cuello', 'Cuello', ['columna (cervical)']],

  const vetadasDe = claves => new Set(claves.flatMap(k => LES[k]?.arts || []));
  const esSeguro = (i, vet) => !D.ejercicios[i][5].some(a => vet.has(a));

  // ═══════════════ Ejercicios conocidos, en español ═══════════════
  // [ejercicio_id, nombre en español, grupo, nivel 1-3, categoría de equipo (o null = la del dato), impacto, isométrico]
  // Se identifican por el ejercicio_id del pipeline y no por su posición en los datos, para que
  // regenerar la página después de un kedro run no cambie a qué ejercicio apunta cada nombre.
  const CURADOS = [
    ['free_exercise_db:Bodyweight_Squat', 'Sentadilla con peso corporal', 'rodilla', 1, null, 0, 0], ['catalogo:1760', 'Sentadilla goblet con mancuerna', 'rodilla', 1, null, 0, 0],
    ['free_exercise_db:Barbell_Squat', 'Sentadilla con barra', 'rodilla', 2, null, 0, 0], ['catalogo:0043', 'Sentadilla profunda con barra', 'rodilla', 3, null, 0, 0],
    ['free_exercise_db:Leg_Press', 'Prensa de piernas', 'rodilla', 1, null, 0, 0], ['wger:999', 'Zancada hacia atrás', 'rodilla', 1, null, 0, 0],
    ['catalogo:0336', 'Zancada con mancuernas', 'rodilla', 2, null, 0, 0], ['catalogo:1460', 'Zancada caminando', 'rodilla', 2, null, 0, 0],
    ['catalogo:0431', 'Subida al cajón con mancuernas', 'rodilla', 2, null, 0, 0], ['wger:632', 'Sentadilla sumo', 'rodilla', 1, null, 0, 0],
    ['catalogo:1001', 'Sentadilla dividida con banda', 'rodilla', 2, null, 0, 0], ['catalogo:0585', 'Extensión de piernas en máquina', 'rodilla', 1, null, 0, 0],
    ['wger:1408', 'Sentadilla isométrica en pared', 'rodilla', 1, 'pc', 0, 1],
    ['wger:265', 'Puente de glúteo', 'cadera', 1, 'pc', 0, 0], ['free_exercise_db:Single_Leg_Glute_Bridge', 'Puente de glúteo a una pierna', 'cadera', 2, null, 0, 0],
    ['wger:294', 'Hip thrust con barra', 'cadera', 2, null, 0, 0], ['catalogo:1459', 'Peso muerto rumano con mancuernas', 'cadera', 2, null, 0, 0],
    ['catalogo:0085', 'Peso muerto rumano con barra', 'cadera', 2, null, 0, 0], ['catalogo:0032', 'Peso muerto con barra', 'cadera', 3, null, 0, 0],
    ['free_exercise_db:Lying_Leg_Curls', 'Curl femoral tumbado', 'cadera', 1, null, 0, 0], ['catalogo:0549', 'Swing con kettlebell', 'cadera', 3, null, 0, 0],
    ['wger:1823', 'Almeja (glúteo medio)', 'cadera', 1, null, 0, 0], ['free_exercise_db:Superman', 'Superman', 'cadera', 1, null, 0, 0],
    ['catalogo:0662', 'Flexiones de brazos', 'pecho', 1, null, 0, 0], ['catalogo:0289', 'Press de banca con mancuernas', 'pecho', 1, null, 0, 0],
    ['catalogo:0025', 'Press de banca con barra', 'pecho', 2, null, 0, 0], ['catalogo:0314', 'Press inclinado con mancuernas', 'pecho', 2, null, 0, 0],
    ['catalogo:0577', 'Press de pecho en máquina', 'pecho', 1, null, 0, 0], ['free_exercise_db:Cable_Crossover', 'Cruce de poleas', 'pecho', 2, null, 0, 0],
    ['catalogo:0308', 'Aperturas con mancuernas', 'pecho', 2, null, 0, 0], ['catalogo:0251', 'Fondos en paralelas', 'pecho', 3, 'gym', 0, 0],
    ['catalogo:0652', 'Dominadas', 'vertical', 3, 'gym', 0, 0], ['catalogo:1326', 'Dominadas supinas', 'vertical', 3, 'gym', 0, 0],
    ['catalogo:0198', 'Jalón al pecho en polea', 'vertical', 1, null, 0, 0],
    ['catalogo:0861', 'Remo sentado en polea', 'horizontal', 1, null, 0, 0], ['catalogo:0293', 'Remo inclinado con mancuernas', 'horizontal', 2, null, 0, 0],
    ['catalogo:0027', 'Remo con barra', 'horizontal', 2, null, 0, 0], ['catalogo:0499', 'Remo invertido', 'horizontal', 2, 'gym', 0, 0],
    ['free_exercise_db:Band_Pull_Apart', 'Separación de banda', 'horizontal', 1, null, 0, 0], ['free_exercise_db:Face_Pull', 'Face pull en polea', 'horizontal', 2, null, 0, 0],
    ['catalogo:0405', 'Press de hombros con mancuernas', 'hombro', 2, null, 0, 0], ['catalogo:0091', 'Press militar con barra', 'hombro', 2, null, 0, 0],
    ['catalogo:0334', 'Elevaciones laterales', 'hombro', 1, null, 0, 0], ['catalogo:0406', 'Encogimientos con mancuernas', 'hombro', 1, null, 0, 0],
    ['catalogo:0294', 'Curl de bíceps con mancuernas', 'biceps', 1, null, 0, 0], ['catalogo:0031', 'Curl de bíceps con barra', 'biceps', 1, null, 0, 0],
    ['catalogo:0313', 'Curl martillo', 'biceps', 1, null, 0, 0],
    ['free_exercise_db:Triceps_Pushdown', 'Extensión de tríceps en polea', 'triceps', 1, null, 0, 0], ['catalogo:0129', 'Fondos en banco', 'triceps', 1, null, 0, 0],
    ['catalogo:0351', 'Extensión de tríceps tumbado', 'triceps', 2, null, 0, 0],
    ['free_exercise_db:Plank', 'Plancha', 'core', 1, null, 0, 1], ['wger:580', 'Plancha lateral', 'core', 1, null, 0, 1], ['catalogo:0276', 'Dead bug', 'core', 1, null, 0, 0],
    ['wger:1572', 'Bird dog (cuadrupedia)', 'core', 1, null, 0, 0], ['wger:1412', 'Abdominal bicicleta', 'core', 1, null, 0, 0],
    ['catalogo:0472', 'Elevación de piernas colgado', 'core', 3, 'gym', 0, 0], ['catalogo:0687', 'Giro ruso', 'core', 2, null, 0, 0],
    ['wger:145', 'Leñador en polea', 'core', 2, null, 0, 0], ['free_exercise_db:Pallof_Press', 'Press Pallof', 'core', 2, null, 0, 0], ['catalogo:0630', 'Escalador', 'core', 2, null, 1, 0],
    ['catalogo:1373', 'Elevación de talones de pie', 'pantorrilla', 1, null, 0, 0], ['catalogo:0605', 'Elevación de talones en máquina', 'pantorrilla', 1, null, 0, 0],
    ['catalogo:0594', 'Elevación de talones sentado', 'pantorrilla', 1, null, 0, 0],
    ['catalogo:0514', 'Sentadilla con salto', 'potencia', 2, null, 1, 0], ['catalogo:3361', 'Saltos de patinador', 'potencia', 2, null, 1, 0],
    ['free_exercise_db:Box_Jump_Multiple_Response', 'Saltos al cajón', 'potencia', 2, 'gym', 1, 0], ['catalogo:1160', 'Burpee', 'potencia', 2, null, 1, 0], ['wger:1314', 'Jumping jacks', 'potencia', 1, null, 1, 0]
  ];
  const CATEG = { 'peso corporal': 'pc', 'peso libre': 'pesas', 'maquina': 'gym', 'cable': 'gym', 'asistido': 'gym', 'maquina de cardio': 'gym',
    'banda elastica': 'banda', 'balon o rodillo': 'balon', 'otro': 'gym' };
  const IDX = Object.fromEntries(D.ids.map((id, k) => [id, k]));
  const ix = id => IDX[id] ?? -1;
  const CUR = {}, CUR_LISTA = [];
  for (const [id, es, grupo, nivel, eq, imp, iso] of CURADOS) {
    const i = ix(id);
    if (i < 0) { console.warn('Ejercicio curado ausente de los datos:', id); continue; }
    CUR[i] = { i, es, grupo, nivel, eq: eq || CATEG[D.equipos[D.ejercicios[i][3]]], imp: !!imp, iso: !!iso };
    CUR_LISTA.push(CUR[i]);
  }
  const nombreEs = i => CUR[i]?.es || null;
  const nombreHTML = i => {
    const en = D.ejercicios[i][0];
    return CUR[i] ? `${esc(CUR[i].es)}<span class="en">${esc(en)}</span>` : `<span style="text-transform:capitalize">${esc(en)}</span>`;
  };
  const nombreTxt = i => CUR[i]?.es || cap(D.ejercicios[i][0]);

  // ═══════════════ Qué trabaja cada ejercicio ═══════════════
  function filaPerfil(i, o, k) {
    const [final, origen, pred, conf] = perfilDe(i)[k] || [-1, '', -1, 0];
    const mia = correccionDe(D.ids[i], o);
    const etiqueta = final >= 0 ? claseEs(o, final) : 'Sin etiqueta';
    const ayuda = final >= 0 ? CLASE_AYUDA[D.clases[o][final]] : `el modelo cree «${claseEs(o, pred).toLowerCase()}» con ${conf} % de confianza, bajo su umbral: prefiere no adivinar`;
    const [txtOrigen, color] = ORIGEN[origen] || ['Sin etiqueta', 'red'];
    const detalleOrigen = origen === 'm' ? `${txtOrigen} · ${conf} %` : txtOrigen;
    return `<li><span><b>${OBJ_NOMBRE[o]}:</b> ${esc(etiqueta)} <span class="que">— ${esc(ayuda)}</span></span>
      <span class="pill ${color}" title="De dónde sale esta etiqueta">${esc(detalleOrigen)}</span>
      ${mia ? `<span class="small" style="flex-basis:100%;color:var(--accent)">Tu corrección: ${esc(claseEs(o, mia.k))} (se usará cuando se reentrene el modelo)</span>` : ''}</li>`;
  }
  function fichaTrabajo(i, { corregir = false } = {}) {
    const e = D.ejercicios[i];
    const apoyo = e[10] || [];
    return `<div class="trabajo">
      <div><span class="lbl-mini">Músculos principales</span>${esc(cap(musculos(e[4])) || '—')}</div>
      ${apoyo.length ? `<div><span class="lbl-mini">Músculos de apoyo</span>${esc(cap(musculos(apoyo)))}</div>` : ''}
      <div><span class="lbl-mini">Articulaciones que carga y sus ligamentos</span><ul class="estructuras">${e[5].map(a => `<li><b>${esc(nomArt(a))}</b><span class="muted">${esc(cap(ESTRUCTURAS[D.articulaciones[a]] || ''))}</span></li>`).join('')}</ul></div>
      <div><span class="lbl-mini">Cómo es el movimiento (modelos de Machine Learning)</span><ul class="perfil-mov">${OBJ.map((o, k) => filaPerfil(i, o, k)).join('')}</ul></div>
      ${corregir ? formCorreccion(i) : ''}
      <p class="muted small">Los ligamentos y tendones son la referencia anatómica de cada articulación, no una medición de este ejercicio. Si tienes una lesión en alguno, marca esa articulación como lesionada.</p>
    </div>`;
  }
  function formCorreccion(i) {
    const id = D.ids[i];
    return `<details class="corregir"><summary>¿Algo no cuadra? Enseña al modelo</summary><div>
      <p class="small">Marca lo que crees correcto. Se guarda en este dispositivo; cuando descargas tus aportes y el equipo reentrena, el modelo aprende de ellos. <a href="#aportes">Cómo funciona</a></p>
      ${OBJ.map((o, k) => {
        const mia = correccionDe(id, o);
        return `<div class="field"><span class="lbl">${OBJ_NOMBRE[o]}</span><div class="seg" role="group" aria-label="${OBJ_NOMBRE[o]}" data-corr-obj="${o}">${D.clases[o].map((c, n) => `<button type="button" data-v="${n}" aria-pressed="${mia?.k === n}">${CLASE_ES[c] || c}</button>`).join('')}</div></div>`;
      }).join('')}
      <div class="row"><button class="btn primary" type="button" data-guardar-corr="${i}">Guardar corrección</button><span class="small" data-msg-corr aria-live="polite"></span></div>
    </div></details>`;
  }
  const GRUPO_MUSC = { rodilla: ['quadriceps'], cadera: ['glutes', 'hamstrings'], pecho: ['pectorals', 'chest'], vertical: ['latissimus dorsi'],
    horizontal: ['upper back', 'rhomboids', 'rear deltoids'], hombro: ['deltoids', 'shoulders'], biceps: ['biceps'], triceps: ['triceps'],
    core: ['abdominals', 'obliques'], pantorrilla: ['calves'], potencia: ['quadriceps', 'glutes'] };
  const GRUPO_NOMBRE = { rodilla: 'Piernas (cuádriceps)', cadera: 'Glúteos e isquiotibiales', pecho: 'Pecho', vertical: 'Espalda (dorsal)',
    horizontal: 'Espalda alta', hombro: 'Hombros', biceps: 'Bíceps', triceps: 'Tríceps', core: 'Core / abdomen', pantorrilla: 'Pantorrillas', potencia: 'Potencia y saltos' };

  // ═══════════════ Almacenamiento local ═══════════════
  const CLAVE = 'sustituto-seguro-v1';
  let S = { perfil: null, rutina: null, sesiones: [], pesos: [], enCurso: null };
  try { const t = localStorage.getItem(CLAVE); if (t) S = Object.assign(S, JSON.parse(t)); } catch (_) { /* sin almacenamiento */ }
  let almacenOK = true;
  let CTA = null; // cuenta conectada al servidor (README §20); se crea más abajo
  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify(S)); almacenOK = true; } catch (_) { almacenOK = false; }
    if (CTA) CTA.cambio();
  }
  const nuevoUid = () => (crypto.randomUUID ? crypto.randomUUID() : 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));

  // ═══════════════ Aportes para el modelo (README §18) ═══════════════
  // Correcciones de etiquetas y calificaciones de alternativas. Se identifican por ejercicio_id y
  // nombre de articulación (no por posición), para seguir valiendo después de regenerar la página.
  const VEREDICTOS = ['bueno', 'aceptable', 'malo', 'inseguro'];
  const VEREDICTO_ES = { bueno: 'Buena', aceptable: 'Aceptable', malo: 'Mala', inseguro: 'Insegura' };
  const aportes = () => S.aportes || (S.aportes = { correcciones: [], revisiones: [] });
  const correccionDe = (id, o) => aportes().correcciones.find(c => c.id === id && c.o === o);
  const revisionDe = (orig, alt, art, perfil) => aportes().revisiones.find(r => r.orig === orig && r.alt === alt && r.art === art && r.perfil === perfil);
  function guardarCorreccion(i, o, k) {
    // Un voto por persona, ejercicio y objetivo: corregir otra vez reemplaza el anterior
    const [final, origen, , conf] = perfilDe(i)[OBJ.indexOf(o)];
    const ap = aportes();
    ap.correcciones = ap.correcciones.filter(c => !(c.id === D.ids[i] && c.o === o));
    ap.correcciones.push({ id: D.ids[i], o, k, previa: final >= 0 ? D.clases[o][final] : '', origen, conf, fecha: new Date().toISOString() });
  }
  function calificar(i, j, art, perfil, v, sim, misma) {
    const ap = aportes(), orig = D.ids[i], alt = D.ids[j], nombre = D.articulaciones[art];
    const previa = revisionDe(orig, alt, nombre, perfil);
    ap.revisiones = ap.revisiones.filter(r => r !== previa);
    if (previa?.v !== v) ap.revisiones.push({ orig, alt, art: nombre, perfil, v, sim: sim / 1000, misma: !!misma, fecha: new Date().toISOString() });
    guardar();
    return previa?.v !== v;
  }
  function archivoAportes() {
    const ap = aportes();
    const correcciones = ap.correcciones.map(c => ({ ejercicio_id: c.id, nombre: D.ejercicios[IDX[c.id]][0], objetivo: c.o,

  // ═══════════════ PROGRESO ═══════════════
  function grafBarras(valores, etiquetas, meta) {
    const W = 560, H = 180, pl = 26, pb = 22, pt = 10, max = Math.max(meta || 0, ...valores, 1);
    const bw = (W - pl) / valores.length;
    const y = v => pt + (H - pt - pb) * (1 - v / max);
    let s = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sesiones por semana">`;
    for (let v = 0; v <= max; v += Math.max(1, Math.ceil(max / 4))) s += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
    if (meta) s += `<line x1="${pl}" x2="${W}" y1="${y(meta)}" y2="${y(meta)}" stroke="var(--amber)" stroke-dasharray="4 4"/>`;
    valores.forEach((v, k) => {
      const x = pl + k * bw + bw * 0.18, w = bw * 0.64;
      s += `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0, H - pb - y(v))}" rx="3" fill="${k === valores.length - 1 ? 'var(--accent)' : 'color-mix(in srgb, var(--accent) 55%, var(--surface))'}"/>`;
      s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${etiquetas[k]}</text>`;
    });
    return s + '</svg>';
  }
  function grafLineas(series, etiquetasX, { yMax, sufijo = '' } = {}) {
    const W = 560, H = 190, pl = 34, pr = 10, pb = 22, pt = 12;
    const todos = series.flatMap(s => s.valores.filter(v => v !== null));
    if (!todos.length) return '';
    const mx = yMax ?? Math.max(...todos) * 1.1, mn = yMax !== undefined ? 0 : Math.min(...todos) * 0.9;
    const n = etiquetasX.length;
    const x = k => pl + (n === 1 ? (W - pl - pr) / 2 : k * (W - pl - pr) / (n - 1));
    const y = v => pt + (H - pt - pb) * (1 - (v - mn) / ((mx - mn) || 1));
    let s = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img">`;
    for (let t = 0; t <= 4; t++) { const v = mn + (mx - mn) * t / 4; s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${Math.round(v * 10) / 10}${sufijo}</text>`; }
    const paso = Math.max(1, Math.ceil(n / 6));
    etiquetasX.forEach((e, k) => { if (k % paso === 0 || k === n - 1) s += `<text x="${x(k)}" y="${H - 6}" text-anchor="middle">${e}</text>`; });
    for (const se of series) {
      const pts = se.valores.map((v, k) => v === null ? null : [x(k), y(v)]).filter(Boolean);
      if (pts.length > 1) s += `<polyline fill="none" stroke="${se.color}" stroke-width="2.2" stroke-linejoin="round" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
      pts.forEach((p, k) => s += `<circle cx="${p[0]}" cy="${p[1]}" r="${k === pts.length - 1 ? 4.5 : 3}" fill="${se.color}"/>`);
    }
    return s + '</svg>';
  }
  const COLORES = ['var(--veto)', 'var(--amber)', 'var(--accent)', '#9C8CF0', '#6FB4F0', '#F08CC8', 'var(--ok)', '#C9C26A'];
  const corto = iso => { const d = new Date(iso + 'T12:00:00'); return d.getDate() + '/' + (d.getMonth() + 1); };
  let ejProgreso = null, confirmarBorrar = null, msgDatos = '';
  function vProgreso() {

        ${grafBarras(porSem, sems.map(corto), st.objetivo)}<p class="muted small">Sesiones por semana, últimas 8 semanas (la fecha es el lunes).</p></section>
      ${conDolor.length && les.length ? `<section class="card"><h3>Dolor por zona</h3>
        <div class="leyenda">${les.map((k, n) => `<span style="--c:${COLORES[n % COLORES.length]}">${esc(LES[k].nombre)}</span>`).join('')}</div>
        ${grafLineas(les.map((k, n) => ({ color: COLORES[n % COLORES.length], valores: conDolor.map(s => s.dolor[k] ?? null) })), conDolor.map(s => corto(s.fecha)), { yMax: 10 })}
        <p class="muted small">Escala 0 a 10, últimas sesiones. Lo ideal es que se mantenga bajo 3.</p></section>` : ''}
      ${ejsReg.length ? `<section class="card"><div class="row" style="justify-content:space-between"><h3>Carga por ejercicio</h3>
          <select id="sel-ej" aria-label="Ejercicio" style="padding:8px 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface-2);max-width:100%">${ejsReg.map(i => `<option value="${i}" ${i === ejProgreso ? 'selected' : ''}>${esc(nombreTxt(i))}</option>`).join('')}</select></div>
        ${grafLineas([{ color: 'var(--accent)', valores: cargas.map(c => c.kg) }], cargas.map(c => corto(c.fecha)), { sufijo: '' })}
        <p class="muted small num-tab">Kilos de la serie más pesada en cada sesión.${cargas.length > 1 ? ` Cambio: ${(cargas[cargas.length - 1].kg - cargas[0].kg) >= 0 ? '+' : ''}${Math.round((cargas[cargas.length - 1].kg - cargas[0].kg) * 10) / 10} kg.` : ''}</p></section>` : ''}
      <section class="card"><h3>Peso corporal</h3>
        <form id="f-pesaje" class="row"><div class="field" style="max-width:160px"><label for="p-kg" class="small">Registrar hoy (kg)</label><input id="p-kg" type="number" inputmode="decimal" min="30" max="250" step="0.1"></div><button class="btn" type="submit" style="align-self:end">Guardar</button></form>
        ${S.pesos.length > 1 ? grafLineas([{ color: 'var(--amber)', valores: S.pesos.slice(-15).map(p => p.kg) }], S.pesos.slice(-15).map(p => corto(p.fecha))) : `<p class="muted small">${S.pesos.length ? 'Registra otro día para ver la evolución.' : 'Opcional. Útil si quieres seguir tu peso junto al entrenamiento.'}</p>`}
      </section>
      ${ses.length ? `<section style="display:grid;gap:10px"><h3>Historial</h3><ul class="historial">${ses.slice().reverse().slice(0, 20).map((s, n) => {
        const idx = ses.length - 1 - n;

      }).join('')}</ul></section>` : ''}
      <section class="card plain"><h3>Respaldo de tus datos</h3><p class="muted small">Tu progreso vive solo en este navegador. Guarda un respaldo para no perderlo o para pasarlo a otro dispositivo.</p>
        <div class="row"><button class="btn" type="button" id="exportar">Guardar respaldo</button><label class="btn" for="importar" style="cursor:pointer">Cargar respaldo</label><input id="importar" type="file" accept="application/json,.json" hidden></div>

  // ═══════════════ Respaldo: validación al cargar ═══════════════
  // Un respaldo es un archivo externo: se reconstruye campo a campo con tipos y valores conocidos,
  // así un archivo alterado no puede insertar HTML en la página ni romper las vistas.
  const ent = (v, min, max, def = null) => { const n = Math.round(Number(v)); return Number.isFinite(n) && n >= min && n <= max ? n : def; };
  const dec = (v, min, max, def = null) => { const n = Number(v); return v !== '' && v !== null && Number.isFinite(n) && n >= min && n <= max ? n : def; };
  const txt = (v, max) => typeof v === 'string' ? v.slice(0, max) : '';
  const fecha = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null;
  const lista = v => Array.isArray(v) ? v : [];
  const ejValido = i => Number.isInteger(i) && i >= 0 && i < D.ejercicios.length;
  const COLOR_AVISO = new Set(['amber', 'red', 'teal']);
  function sanearPerfil(p) {
    if (!p || typeof p !== 'object') return null;
    const edad = ent(p.edad, 10, 100);
    if (edad === null) return null;
    return { edad, peso: dec(p.peso, 30, 250, ''), altura: ent(p.altura, 120, 230, ''),
      deporte: tiene(DEPORTES, p.deporte) ? p.deporte : 'ninguno', nivel: ['principiante', 'intermedio', 'avanzado'].includes(p.nivel) ? p.nivel : 'principiante',
      objetivo: tiene(OBJETIVOS, p.objetivo) ? p.objetivo : 'salud', dias: ent(p.dias, 2, 6, 3), minutos: [30, 45, 60, 75].includes(p.minutos) ? p.minutos : 45,
      tipo: tiene(TIPOS, p.tipo) ? p.tipo : 'auto',
      equipo: [...new Set(lista(p.equipo).filter(e => EQ_OPC.some(([k]) => k === e && k !== 'pc')))],
      lesiones: [...new Set(lista(p.lesiones).filter(k => tiene(LES, k)))] };
  }
  function sanearRutina(r) {
    if (!r || typeof r !== 'object') return null;
    const perfil = sanearPerfil(r.perfil);
    if (!perfil) return null;
    const vet = vetadasDe(perfil.lesiones);
    const dias = lista(r.dias).slice(0, 6).map(d => ({
      titulo: txt(d?.titulo, 60), equilibrio: d?.equilibrio === true,
      ejercicios: lista(d?.ejercicios).slice(0, 12).filter(e => ejValido(e?.i) && esSeguro(e.i, vet)).map(e => ({
        i: e.i, grupo: tiene(GRUPO_NOMBRE, e.grupo) ? e.grupo : 'core', series: ent(e.series, 1, 6, 3), reps: txt(e.reps, 12) || '10',
        descanso: ent(e.descanso, 15, 300, 60), iso: e.iso === true, extra: e.extra === true,
        alternativas: lista(e.alternativas).filter(a => ejValido(a) && esSeguro(a, vet)).slice(0, 8) }))
    })).filter(d => d.ejercicios.length);
    if (!dias.length) return null;
    return { creada: fecha(r.creada) || hoyISO(), perfil, objetivo: tiene(OBJETIVOS, r.objetivo) ? r.objetivo : perfil.objetivo,
      tipo: tiene(MIN_DIAS, r.tipo) ? r.tipo : undefined, porqueTipo: txt(r.porqueTipo, 200),
      avisos: lista(r.avisos).filter(a => Array.isArray(a) && COLOR_AVISO.has(a[0])).slice(0, 8).map(a => [a[0], txt(a[1], 80), txt(a[2], 300)]),
      huecos: lista(r.huecos).filter(g => tiene(GRUPO_NOMBRE, g)), dias, ia: null };
  }
  function sanearRespaldo(x) {
    if (!x || typeof x !== 'object' || !Array.isArray(x.sesiones)) throw new Error('formato');
    const rutina = sanearRutina(x.rutina);
    const sesiones = x.sesiones.map(s => {
      const f = fecha(s?.fecha); if (!f) return null;
      const dolor = {};
      for (const [k, v] of Object.entries(s.dolor && typeof s.dolor === 'object' ? s.dolor : {})) { const n = ent(v, 0, 10); if (tiene(LES, k) && n !== null) dolor[k] = n; }
      return { uid: txt(s.uid, 64) || nuevoUid(), fecha: f, dia: ent(s.dia, 0, 5, 0), titulo: txt(s.titulo, 60), minutos: ent(s.minutos, 1, 300, 1), esfuerzo: ent(s.esfuerzo, 1, 10, 6),
        dolor, notas: txt(s.notas, 500),
        ejercicios: lista(s.ejercicios).filter(e => ejValido(e?.i)).map(e => ({ i: e.i,
          series: lista(e.series).slice(0, 10).map(z => ({ kg: dec(z?.kg, 0, 1000), reps: ent(z?.reps, 0, 1000, 0) })) })).filter(e => e.series.length) };
    }).filter(Boolean).sort((a, b) => a.fecha.localeCompare(b.fecha));
    const pesos = lista(x.pesos).map(p => ({ fecha: fecha(p?.fecha), kg: dec(p?.kg, 30, 250) })).filter(p => p.fecha && p.kg !== null)
      .sort((a, b) => a.fecha.localeCompare(b.fecha));
    return { perfil: sanearPerfil(x.perfil) || rutina?.perfil || null, rutina, sesiones, pesos, enCurso: null, aportes: sanearAportes(x.aportes) };
  }
  function sanearAportes(a) {
    const correcciones = lista(a?.correcciones).filter(c => c && tiene(IDX, c.id) && OBJ.includes(c.o) && Number.isInteger(c.k) && c.k >= 0 && c.k < D.clases[c.o].length)
      .map(c => ({ id: c.id, o: c.o, k: c.k, previa: D.clases[c.o].includes(c.previa) ? c.previa : '', origen: tiene(ORIGEN, c.origen) ? c.origen : '',
        conf: ent(c.conf, 0, 100, 0), fecha: txt(c.fecha, 40) || new Date().toISOString() }));
    const revisiones = lista(a?.revisiones).filter(r => r && tiene(IDX, r.orig) && tiene(IDX, r.alt) && tiene(A, r.art) && (r.perfil === 0 || r.perfil === 1) && VEREDICTOS.includes(r.v))
      .map(r => ({ orig: r.orig, alt: r.alt, art: r.art, perfil: r.perfil, v: r.v, sim: dec(r.sim, 0, 1, 0), misma: r.misma === true, fecha: txt(r.fecha, 40) || new Date().toISOString() }));
    return { correcciones: correcciones.slice(-2000), revisiones: revisiones.slice(-2000) };
  }


  // ═══════════════ CUENTAS (README §20) ═══════════════
  // Si la página la entrega el servidor de cuentas (AWS o `python -m api.servidor`), cada persona puede
  // registrarse y guardar su perfil, rutina, sesiones, peso y aportes en la base de datos. Sin servidor,
  // todo sigue guardándose solo en este navegador. En la base los ejercicios van por ejercicio_id, no por
  // posición: así la web y la app de iPhone hablan del mismo ejercicio.
  const CLAVE_CUENTA = 'sustituto-seguro-cuenta';
  const cuenta = { disponible: null, token: null, usuario: null, estado: '', error: '', aviso: '', ultimo: null };
  try { const c = JSON.parse(localStorage.getItem(CLAVE_CUENTA) || 'null'); if (c && c.token) Object.assign(cuenta, { token: c.token, usuario: c.usuario }); } catch (_) { /* sin almacenamiento */ }
  const guardarCuenta = () => { try { localStorage.setItem(CLAVE_CUENTA, JSON.stringify(cuenta.token ? { token: cuenta.token, usuario: cuenta.usuario } : null)); } catch (_) { /* */ } };

  async function api(metodo, ruta, cuerpo) {
    const r = await fetch('/api/' + ruta, { method: metodo, headers: { 'Content-Type': 'application/json', ...(cuenta.token ? { Authorization: 'Bearer ' + cuenta.token } : {}) },
      body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo) });
    let d = {}; try { d = await r.json(); } catch (_) { /* respuesta vacía */ }
    if (r.status === 401 && cuenta.token && ruta !== 'sesion') perderSesion();
    if (!r.ok) { const e = new Error(d.error || 'No se pudo conectar con el servidor.'); e.status = r.status; throw e; }
    return d;
  }

  // Web → base de datos
  const nulo = v => v === '' || v === undefined ? null : v;
  const perfilApi = p => p && { ...p, peso: nulo(p.peso), altura: nulo(p.altura), tipo: p.tipo || 'auto' };
  const idDe = i => D.ids[i];
  const rutinaApi = r => r && { creada: r.creada, objetivo: r.objetivo, tipo: r.tipo || null, porqueTipo: r.porqueTipo || '', perfil: perfilApi(r.perfil),
    avisos: r.avisos || [], huecos: r.huecos || [],
    dias: r.dias.map(d => ({ titulo: d.titulo, equilibrio: !!d.equilibrio, ejercicios: d.ejercicios.map(e => ({ id: idDe(e.i), grupo: e.grupo, series: e.series,
      reps: String(e.reps), descanso: e.descanso, iso: !!e.iso, extra: !!e.extra, alternativas: (e.alternativas || []).map(idDe) })) })) };
  const sesionApi = s => ({ uid: s.uid, fecha: s.fecha, dia: s.dia, titulo: s.titulo || '', minutos: s.minutos, esfuerzo: s.esfuerzo, notas: s.notas || '',
    dolor: s.dolor || {}, ejercicios: s.ejercicios.map(e => ({ id: idDe(e.i), series: e.series.map(z => ({ kg: z.kg === '' ? null : z.kg, reps: z.reps })) })), origen: 'web' });
  const correccionApi = c => ({ ejercicio_id: c.id, objetivo: c.o, etiqueta: D.clases[c.o][c.k], etiqueta_previa: c.previa || '',
    origen_previo: ORIGEN_PIPELINE[c.origen] || '', confianza_previa: (c.conf || 0) / 100, fecha: c.fecha });
  const revisionApi = r => ({ original_id: r.orig, alternativa_id: r.alt, articulacion: r.art, perfil: r.perfil ? 'principiante' : 'cualquiera',
    veredicto: r.v, similitud: r.sim, misma_familia: !!r.misma, fecha: r.fecha });

  // Base de datos → web (y por el mismo saneamiento que un respaldo: nada externo entra sin revisar)
  const iDe = id => tiene(IDX, id) ? IDX[id] : -1;
  const ORIGEN_WEB = Object.fromEntries(Object.entries(ORIGEN_PIPELINE).map(([k, v]) => [v, k]));
  function datosWeb(d) {
    const rutina = d.rutina && { ...d.rutina, dias: (d.rutina.dias || []).map(dia => ({ ...dia, ejercicios: (dia.ejercicios || []).map(e => ({ ...e, i: iDe(e.id),
      alternativas: (e.alternativas || []).map(iDe).filter(i => i >= 0) })).filter(e => e.i >= 0) })) };
    const crudo = { perfil: d.perfil, rutina,
      sesiones: (d.sesiones || []).map(s => ({ ...s, ejercicios: (s.ejercicios || []).map(e => ({ i: iDe(e.id), series: e.series })).filter(e => e.i >= 0) })),
      pesos: d.pesos || [],
      aportes: { correcciones: (d.correcciones || []).map(c => ({ id: c.ejercicio_id, o: c.objetivo, k: (D.clases[c.objetivo] || []).indexOf(c.etiqueta),
        previa: c.etiqueta_previa, origen: ORIGEN_WEB[c.origen_previo] || '', conf: Math.round((c.confianza_previa || 0) * 100), fecha: c.fecha })),
        revisiones: (d.revisiones || []).map(r => ({ orig: r.original_id, alt: r.alternativa_id, art: r.articulacion, perfil: r.perfil === 'principiante' ? 1 : 0,
          v: r.veredicto, sim: r.similitud, misma: !!r.misma_familia, fecha: r.fecha })) } };
    return sanearRespaldo(crudo);
  }
  const fotoLocal = () => {
    S.sesiones.forEach(s => { if (!s.uid) s.uid = nuevoUid(); });
    return { perfil: JSON.stringify(perfilApi(S.perfil) || null), rutina: JSON.stringify(rutinaApi(S.rutina) || null),
      sesiones: new Map(S.sesiones.map(s => [s.uid, JSON.stringify(sesionApi(s))])), pesos: new Map(S.pesos.map(p => [p.fecha, p.kg])),
      aportes: JSON.stringify({ c: (S.aportes?.correcciones || []).map(correccionApi), r: (S.aportes?.revisiones || []).map(revisionApi) }) };
  };

  function aplicarDatosDeLaCuenta(d) {
    const enCurso = S.enCurso;
    S = { ...datosWeb(d), enCurso };
    try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch (_) { /* */ }
    cuenta.ultimo = fotoLocal();
  }

  async function entrarYSincronizar(respuesta) {
    cuenta.token = respuesta.token; cuenta.usuario = respuesta.usuario; guardarCuenta();
    const f = fotoLocal();
    const local = { perfil: JSON.parse(f.perfil), rutina: JSON.parse(f.rutina), sesiones: [...f.sesiones.values()].map(x => JSON.parse(x)),
      pesos: [...f.pesos].map(([fecha, kg]) => ({ fecha, kg })), correcciones: JSON.parse(f.aportes).c, revisiones: JSON.parse(f.aportes).r };
    aplicarDatosDeLaCuenta(await api('POST', 'sincronizar', local));
    cuenta.estado = 'Guardado en tu cuenta'; cuenta.error = '';
  }

  function perderSesion() {
    // La sesión venció o la cuenta ya no existe: se conservan los datos locales, que se suben al volver a entrar
    cuenta.token = null; cuenta.usuario = null; cuenta.ultimo = null; guardarCuenta();
    cuenta.error = 'Tu sesión terminó. Vuelve a iniciar sesión: lo que hiciste se guarda aquí mientras tanto.';
    pintarBarraCuenta();
  }

  function salirLocal(mensaje) {
    // Al cerrar sesión, este dispositivo deja de guardar los datos de la cuenta: quedan en el servidor
    cuenta.token = null; cuenta.usuario = null; cuenta.ultimo = null; guardarCuenta();
    S = { perfil: null, rutina: null, sesiones: [], pesos: [], enCurso: null };
    try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch (_) { /* */ }
    cuenta.aviso = mensaje || ''; cuenta.error = ''; cuenta.estado = '';
    if (typeof render === 'function') render();
  }

  // Cada cambio local se sube en segundo plano: solo lo que cambió desde la última vez
  let temporizadorSync = null, sincronizando = false, pendiente = false;
  async function subirCambios() {
    if (!cuenta.token || !cuenta.ultimo) return;
    if (sincronizando) { pendiente = true; return; }
    sincronizando = true;
    try {
      const antes = cuenta.ultimo, ahora = fotoLocal();
      if (ahora.perfil !== antes.perfil && ahora.perfil !== 'null') await api('PUT', 'datos/perfil', JSON.parse(ahora.perfil));
      if (ahora.rutina !== antes.rutina) await (ahora.rutina === 'null' ? api('DELETE', 'datos/rutina') : api('PUT', 'datos/rutina', JSON.parse(ahora.rutina)));
      for (const [uid, s] of ahora.sesiones) if (antes.sesiones.get(uid) !== s) await api('POST', 'datos/sesiones', JSON.parse(s));
      for (const uid of antes.sesiones.keys()) if (!ahora.sesiones.has(uid)) await api('DELETE', 'datos/sesiones/' + encodeURIComponent(uid));
      for (const [fecha, kg] of ahora.pesos) if (antes.pesos.get(fecha) !== kg) await api('PUT', 'datos/pesos', { fecha, kg });
      for (const fecha of antes.pesos.keys()) if (!ahora.pesos.has(fecha)) await api('DELETE', 'datos/pesos/' + fecha);
      if (ahora.aportes !== antes.aportes) { const a = JSON.parse(ahora.aportes); await api('POST', 'datos/aportes', { correcciones: a.c, revisiones: a.r }); }
      cuenta.ultimo = ahora; cuenta.estado = 'Guardado en tu cuenta'; cuenta.error = '';
    } catch (e) {
      if (cuenta.token) { cuenta.error = e.status ? e.message : 'Sin conexión: tus cambios se guardan aquí y se subirán cuando vuelva.'; }
    } finally {
      sincronizando = false; pintarBarraCuenta();
      if (vista === 'cuenta') vCuenta();
      if (pendiente) { pendiente = false; subirCambios(); }
    }
  }
  CTA = { cambio() { if (!cuenta.token) return; clearTimeout(temporizadorSync); temporizadorSync = setTimeout(subirCambios, 600); } };
  window.addEventListener('online', () => { if (cuenta.token) subirCambios(); });

  async function comprobarServidor() {
    if (!/^https?:$/.test(location.protocol)) { cuenta.disponible = false; return; }
    try {
      const r = await fetch('/api/salud', { cache: 'no-store' });
      const d = r.ok ? await r.json() : null;
      cuenta.disponible = !!(d && d.cuentas);
    } catch (_) { cuenta.disponible = false; }
    if (cuenta.disponible && cuenta.token) {
      try { aplicarDatosDeLaCuenta(await api('GET', 'datos')); cuenta.estado = 'Guardado en tu cuenta'; }
      catch (e) { if (cuenta.token) cuenta.error = 'Sin conexión con tu cuenta: usando lo guardado en este dispositivo.'; }
    }
    render();
  }

  function pintarBarraCuenta() {
    const b = $('cuenta-barra'); if (!b) return;
    b.hidden = !cuenta.disponible || vista === 'cuenta';
    if (b.hidden) return;
    b.innerHTML = cuenta.token
      ? `<a class="cuenta-chip ${cuenta.error ? 'error' : 'activa'}" href="#cuenta"><span class="punto" aria-hidden="true"></span>${esc(cuenta.usuario?.nombre || 'Mi cuenta')}</a>`
      : `<a class="cuenta-chip" href="#cuenta"><span class="punto" aria-hidden="true"></span>Iniciar sesión</a>`;
  }

  let modoCuenta = 'entrar', borrandoCuenta = false;
  function vCuenta() {
    if (cuenta.disponible === null) { app.innerHTML = '<div class="vista"><p class="muted">Conectando…</p></div>'; return; }
    if (!cuenta.disponible) {
      app.innerHTML = `<div class="vista"><header class="hero" style="padding-top:0"><div class="eyebrow">Mi cuenta</div><h1 style="font-size:clamp(1.8rem,5vw,2.4rem)">Esta versión no tiene cuentas</h1>
        <p class="lead">Tus datos se guardan solo en este navegador. Las cuentas funcionan en la versión publicada con servidor (AWS), donde puedes usar la misma cuenta en la web y en la app de iPhone.</p></header>
        <div class="row"><a class="btn" href="#progreso">Ir a mi progreso</a></div></div>`;

    }
    if (!cuenta.token) {
      const registro = modoCuenta === 'registro';
      app.innerHTML = `<div class="vista">
        <header class="hero" style="padding-top:0"><div class="eyebrow">Mi cuenta</div><h1 style="font-size:clamp(1.8rem,5vw,2.4rem)">${registro ? 'Crea tu cuenta' : 'Inicia sesión'}</h1>
          <p class="lead">Con una cuenta, tu perfil, tu rutina y tu progreso quedan guardados en el servidor y los ves igual en la web y en la app de iPhone.</p></header>
        <section class="card">
          <div class="pestanas-cuenta" role="tablist"><button type="button" role="tab" data-modo="entrar" aria-selected="${!registro}">Iniciar sesión</button><button type="button" role="tab" data-modo="registro" aria-selected="${registro}">Crear cuenta</button></div>
          <form id="f-cuenta" class="pasos-form" novalidate>
            ${registro ? '<div class="field"><label for="c-nombre">Tu nombre</label><input id="c-nombre" autocomplete="name" maxlength="80" required></div>' : ''}
            <div class="field"><label for="c-email">Correo</label><input id="c-email" type="email" autocomplete="email" inputmode="email" required></div>
            <div class="field"><label for="c-clave">Contraseña${registro ? ' <span class="muted small">(al menos 8 caracteres)</span>' : ''}</label><input id="c-clave" type="password" autocomplete="${registro ? 'new-password' : 'current-password'}" minlength="8" required></div>
            ${registro ? `<label class="casilla"><input type="checkbox" id="c-acepto"><span>Acepto que mi perfil (edad, peso, lesiones), mi rutina y mis sesiones se guarden en mi cuenta. Puedo borrar la cuenta y todos sus datos cuando quiera.</span></label>` : ''}
            ${S.sesiones.length || S.perfil ? `<p class="muted small">Lo que tienes guardado en este navegador (${S.sesiones.length} sesiones) se sube a tu cuenta al entrar.</p>` : ''}
            ${cuenta.aviso ? `<p class="small" style="color:var(--ok)" role="status">${esc(cuenta.aviso)}</p>` : ''}
            <p id="c-error" class="small" style="color:var(--veto)" role="alert">${esc(cuenta.error)}</p>
            <div class="row"><button class="btn primary" type="submit" id="c-enviar">${registro ? 'Crear cuenta' : 'Entrar'}</button></div>
          </form>
        </section></div>`;
      app.querySelectorAll('[data-modo]').forEach(b => b.onclick = () => { modoCuenta = b.dataset.modo; cuenta.error = ''; cuenta.aviso = ''; vCuenta(); });
      $('f-cuenta').addEventListener('submit', async ev => {

        if (registro && !$('c-acepto').checked) { err.textContent = 'Para crear la cuenta tienes que aceptar que tus datos se guarden en ella.'; return; }
        boton.disabled = true; err.textContent = ''; cuenta.aviso = '';

      });

    }
    const u = cuenta.usuario || {};
    app.innerHTML = `<div class="vista">
      <header class="hero" style="padding-top:0"><div class="eyebrow">Mi cuenta</div><h1 style="font-size:clamp(1.8rem,5vw,2.4rem)">Hola, ${esc(u.nombre || '')}</h1>
        <p class="lead">${esc(u.email || '')}</p></header>
      <div class="aviso ${cuenta.error ? 'amber' : 'teal'}" role="status"><p><b>${cuenta.error ? 'Atención:' : 'Al día.'}</b> ${esc(cuenta.error || cuenta.estado || 'Tus datos se guardan en tu cuenta.')}</p></div>
      <section class="resumen-inicio">
        <div class="kpi"><span class="v num-tab">${S.sesiones.length}</span><span class="l">Sesiones en tu cuenta</span></div>
        <div class="kpi"><span class="v num-tab">${S.pesos.length}</span><span class="l">Registros de peso</span></div>
        <div class="kpi"><span class="v num-tab">${(S.aportes?.correcciones?.length || 0) + (S.aportes?.revisiones?.length || 0)}</span><span class="l">Aportes al modelo</span></div>
        <div class="kpi"><span class="v">${S.rutina ? 'Sí' : 'No'}</span><span class="l">Rutina guardada</span></div>
      </section>
      <section class="card"><h3>Qué se guarda</h3>
        <p class="muted">Tu nombre, tu correo y tu contraseña cifrada; tu perfil (edad, peso, altura, deporte, nivel, equipamiento y lesiones), tu rutina, tus sesiones con el dolor que registraste, tu peso y tus aportes al modelo. Para reentrenar el modelo solo se usan tus aportes, sin tu nombre ni tu correo.</p>
        <div class="row"><button class="btn" type="button" id="c-sync">Sincronizar ahora</button><button class="btn ghost" type="button" id="c-salir">Cerrar sesión</button></div>

  // ═══════════════ EL MODELO POR DENTRO (EV3) ═══════════════
  const filasDe = t => t.filas.map(f => Object.fromEntries(t.columnas.map((c, k) => [c, f[k]])));
  const MODELO_ES = { regresion_logistica: 'Regresión logística', random_forest: 'Random Forest', extra_trees: 'Extra Trees',
    boosting_por_defecto: 'Boosting por defecto', boosting: 'Boosting ajustado', voting: 'Voting', stacking: 'Stacking' };

  const num = (v, d = 3) => v === null || v === undefined || Number.isNaN(v) ? '—' : v.toFixed(d).replace('.', ',');
  const signo = (v, d = 3) => v === null || v === undefined ? '—' : (v >= 0 ? '+' : '−') + num(Math.abs(v), d);
  const CANDIDATOS = filasDe(D.modelo.candidatos);
  const AZAR = Object.fromEntries(filasDe(D.modelo.azar).map(f => [f.objetivo, f.f1_macro]));
  const BUSQUEDA = Object.fromEntries(filasDe(D.modelo.busqueda_boosting).map(f => [f.objetivo, f.cv_f1_macro]));
  const SIMULACION = filasDe(D.aprendizaje.simulacion);
  const INFORME_APRENDIZAJE = filasDe(D.aprendizaje.informe);
  const MEJORA_MINIMA = 0.02, PLIEGUES_MINIMOS = 80, T_MINIMO = 2;
  const DATOS = D.datos;
  const COLOR_CLASE = ['var(--accent)', 'var(--amber)', '#9C8CF0'];

  function grafCurva(series, xs, etiqueta) {

    for (let v = mn; v <= mx + 1e-9; v += 0.1) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${num(v, 1)}</text>`;

        </ol></section>
      <section class="card"><h3>Tus correcciones</h3>
        ${ap.correcciones.length ? `<div class="scroll-x"><table class="tabla"><thead><tr><th>Ejercicio</th><th>Qué</th><th>Antes</th><th>Tu respuesta</th><th></th></tr></thead><tbody>
          ${ap.correcciones.map((c, n) => `<tr><td>${esc(nombreTxt(IDX[c.id]))}</td><td>${OBJ_NOMBRE[c.o]}</td><td>${esc(CLASE_ES[c.previa] || 'Sin etiqueta')}${c.origen ? ` <span class="muted small">(${esc((ORIGEN[c.origen] || [''])[0].toLowerCase())})</span>` : ''}</td><td><b>${esc(claseEs(c.o, c.k))}</b></td><td><button class="btn ghost small" type="button" data-quitar-corr="${n}">Quitar</button></td></tr>`).join('')}
          </tbody></table></div>` : '<p class="muted">Todavía no corriges ninguna etiqueta. Abre «Qué trabaja este ejercicio» en <a href="#sustituir">Sustituir</a>.</p>'}</section>
      <section class="card"><h3>Tus calificaciones de alternativas</h3>
        ${ap.revisiones.length ? `<div class="scroll-x"><table class="tabla"><thead><tr><th>Original</th><th>Alternativa</th><th>Zona lesionada</th><th>Tu respuesta</th><th></th></tr></thead><tbody>
          ${ap.revisiones.map((r, n) => `<tr><td>${esc(nombreTxt(IDX[r.orig]))}</td><td>${esc(nombreTxt(IDX[r.alt]))}</td><td>${esc(nomArt(A[r.art]))}</td><td><b>${VEREDICTO_ES[r.v]}</b></td><td><button class="btn ghost small" type="button" data-quitar-rev="${n}">Quitar</button></td></tr>`).join('')}
          </tbody></table></div>` : '<p class="muted">Todavía no calificas alternativas. En <a href="#sustituir">Sustituir</a>, responde «¿Te sirve?» bajo cada una.</p>'}</section>
      <section class="card plain"><h3>Entrega tus aportes</h3>
        <p class="muted small">Descarga el archivo y envíaselo al equipo. Se guarda como <code>sustituto-seguro-aportes-${hoyISO()}.json</code>.</p>
        <div class="row"><button class="btn primary" type="button" id="descargar-aportes" ${ap.correcciones.length + ap.revisiones.length ? '' : 'disabled'}>Descargar mis aportes</button>
          <button class="btn ghost danger" type="button" id="borrar-aportes" ${ap.correcciones.length + ap.revisiones.length ? '' : 'disabled'}>Borrar todos</button>
          <a class="btn ghost" href="#modelo">Ver cuánto aprende el modelo</a></div>
        <p class="small" id="msg-aportes" aria-live="polite">${esc(msgAportes)}</p></section>
    </div>`;
    msgAportes = '';
    app.querySelectorAll('[data-quitar-corr]').forEach(b => b.onclick = () => { ap.correcciones.splice(+b.dataset.quitarCorr, 1); guardar(); vAportes(); });
    app.querySelectorAll('[data-quitar-rev]').forEach(b => b.onclick = () => { ap.revisiones.splice(+b.dataset.quitarRev, 1); guardar(); vAportes(); });
    $('descargar-aportes').onclick = async () => {
      try { await descargar(`sustituto-seguro-aportes-${hoyISO()}.json`, archivoAportes()); $('msg-aportes').textContent = 'Archivo descargado. Envíaselo al equipo para reentrenar el modelo.'; }
      catch (e) { $('msg-aportes').textContent = e?.code === 'cancelled' || e?.code === 'declined' ? 'No se descargó el archivo.' : 'No se pudo descargar el archivo en este navegador.'; }
    };
    $('borrar-aportes').onclick = () => {
      if ($('borrar-aportes').dataset.confirmar) { S.aportes = { correcciones: [], revisiones: [] }; guardar(); msgAportes = 'Aportes borrados.'; vAportes(); return; }
      $('borrar-aportes').dataset.confirmar = '1'; $('borrar-aportes').textContent = '¿Seguro? Toca otra vez para borrar';
    };
  }

  // ═══════════════ CÓMO FUNCIONA ═══════════════
  function vComo() {
    app.innerHTML = `<div class="vista">
      <header class="hero" style="padding-top:0"><div class="eyebrow">Cómo funciona</div><h1 style="font-size:clamp(1.8rem,5vw,2.6rem)">Seguridad primero, y después todo lo demás</h1>
        <p class="lead">Esta aplicación nace de un proyecto de Machine Learning que modela cada ejercicio por su mecánica: qué músculos trabaja y qué articulaciones carga. Así puede evitar la zona lesionada sin dejar de entrenar el músculo.</p></header>
      <section class="card"><h3>Cómo usarla</h3>
        <ol class="como-pasos">
          <li><h3>Arma tu rutina</h3><p>Ingresa edad, peso, deporte, nivel, días, minutos, equipamiento y lesiones. La rutina se crea al instante.</p></li>
          <li><h3>Ajústala</h3><p>Cambia un ejercicio por otra opción segura con un toque, genera otra variante o, si tienes cuenta de Claude, pídele a la IA que la revise.</p></li>
          <li><h3>Entrena con la app</h3><p>Elige el día, anota peso y repeticiones, marca cada serie y descansa con el cronómetro.</p></li>
          <li><h3>Registra cómo te sentiste</h3><p>Al terminar anotas el esfuerzo y el dolor de cada zona lesionada. Si sube, la app te avisa.</p></li>
          <li><h3>Mira tu progreso</h3><p>Constancia semanal, cargas por ejercicio, dolor y peso corporal en gráficos.</p></li>
        </ol></section>
      <section style="display:grid;gap:10px"><h3>Preguntas frecuentes</h3>
        <details open><summary>¿Cómo sabe qué ejercicio es seguro?</summary><div>
          <p>Cada ejercicio tiene registrados sus músculos principales y de apoyo, y cada músculo las articulaciones que cruza. Si un ejercicio carga una articulación que marcaste, queda fuera. Es un filtro estricto: no importa qué tan bueno sea el ejercicio.</p>
          <p>Para lesiones usamos un criterio conservador. Por ejemplo, si marcas muñeca también evitamos los ejercicios que cargan el antebrazo, y si marcas zona lumbar evitamos los que cargan la espalda media.</p></div></details>
        <details><summary>¿Por qué a veces me cambia el músculo?</summary><div>
          <p>Algunos músculos cruzan la articulación lesionada. El cuádriceps cruza la rodilla: no existe forma de trabajarlo sin cargarla. En esos casos mantenemos los músculos que sí se pueden trabajar (por ejemplo, glúteos) y te lo explicamos.</p>
          <p>Si ningún músculo principal se puede conservar, la aplicación no recomienda nada y te sugiere consultar a un kinesiólogo, en vez de inventar una alternativa.</p></div></details>
        <details><summary>¿Cómo se ordenan las alternativas?</summary><div>
          <p>Primero las del mismo tipo de movimiento (empuje, tracción, estiramiento). Después por parecido biomecánico, calculado con un grafo que conecta ejercicios, músculos y articulaciones (técnica Node2Vec, agrupada en 12 familias de movimiento). Si ninguna opción se hace con peso corporal, se agrega una al final para quien entrena en casa.</p></div></details>
        <details><summary>¿Cómo se arma la rutina?</summary><div>
          <p>Puedes elegir el tipo: cuerpo completo, torso / pierna, Push / Pull / Legs (empuje, tracción y piernas), Arnold o un grupo por día. Si dejas «Recomendada para ti», lo elegimos según tus días y tu nivel: con 2 días, cuerpo completo; con 3, cuerpo completo para principiantes y Push / Pull / Legs con experiencia; con 4, torso y pierna; con 5 o 6, Push / Pull / Legs. Los minutos definen cuántos ejercicios entran. El objetivo define series, repeticiones y descanso.</p>
          <p>La edad ajusta la dificultad: con menos de 18 años se evitan series de muy pocas repeticiones; con 60 o más se evitan saltos y se suma equilibrio. El peso y la altura sirven para decidir si conviene empezar sin ejercicios de impacto. El deporte agrega ejercicios complementarios.</p></div></details>
        <details><summary>¿Qué músculos y ligamentos trabaja cada ejercicio?</summary><div>
          <p>Abre «Qué trabaja» en cualquier ejercicio: verás sus músculos principales y de apoyo, las articulaciones que carga con sus ligamentos y tendones principales, y cómo lo describe el modelo (mecánica, fuerza y complejidad), con el origen de cada dato y la confianza del modelo.</p></div></details>
        <details><summary>¿El modelo aprende de mí?</summary><div>
          <p>Sí, si quieres. Cuando corriges cómo describimos un ejercicio o calificas una alternativa, se guarda como aporte. Descárgalo en <a href="#aportes">Enseña al modelo</a> y envíalo: el equipo reentrena con los aportes de todos, y solo los adopta si el modelo no empeora. Puedes ver el efecto en <a href="#modelo">El modelo por dentro</a>.</p></div></details>
        <details><summary>¿Qué hace la IA?</summary><div>
          <p>Revisa tu rutina, te explica por qué sirve, da consejos y propone cambios. Solo puede elegir entre ejercicios que ya pasaron el filtro de seguridad, y tú decides si aplicarlos. También puedes hacerle preguntas sobre tu entrenamiento.</p>
          <p>Funciona con tu propia cuenta de Claude y te pide permiso la primera vez. Si no tienes cuenta, el resto de la aplicación funciona igual.</p></div></details>
        <details><summary>¿Dónde quedan mis datos?</summary><div>
          <p>En tu navegador, en este dispositivo. No hay cuentas ni servidor que los guarde. Si borras los datos del navegador o cambias de teléfono, se pierden: usa “Guardar respaldo” en la sección Progreso.</p></div></details>
        <details><summary>¿Qué tan confiable es?</summary><div>
          <p>Con 2.461 ejercicios de tres fuentes abiertas, el sistema encuentra al menos 3 alternativas para el 89 % de los ejercicios que se pueden sustituir. En rodilla y hombro la cobertura es menor. Los nombres en español están revisados para los ejercicios más comunes; el resto aparece con su nombre original en inglés.</p>
          <p>Es una herramienta informativa basada en datos: no conoce tu lesión en detalle. Un kinesiólogo siempre tiene la última palabra.</p></div></details>
      </section>
      <div class="row"><a class="btn primary" href="#rutina">Crear mi rutina</a><a class="btn" href="#sustituir">Sustituir un ejercicio</a></div>
    </div>`;
  }

  // Corregir etiquetas y calificar alternativas, en cualquier vista (delegación en #app)
  app.addEventListener('click', ev => {
    const opcion = ev.target.closest('[data-corr-obj] [data-v]');
    if (opcion) {
      const ya = opcion.getAttribute('aria-pressed') === 'true';
      opcion.parentElement.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', 'false'));
      opcion.setAttribute('aria-pressed', String(!ya));
      return;
    }
    const boton = ev.target.closest('[data-guardar-corr]');
    if (boton) {
      const i = +boton.dataset.guardarCorr, caja = boton.closest('details'), msg = caja.querySelector('[data-msg-corr]');
      const elegidas = [...caja.querySelectorAll('[data-corr-obj]')].map(seg => [seg.dataset.corrObj, seg.querySelector('[aria-pressed="true"]')]).filter(([, b]) => b);
      if (!elegidas.length) { msg.textContent = 'Marca al menos una opción.'; return; }
      elegidas.forEach(([o, b]) => guardarCorreccion(i, o, +b.dataset.v));
      guardar();
      const lista = caja.closest('.trabajo')?.querySelector('.perfil-mov');
      if (lista) lista.innerHTML = OBJ.map((o, k) => filaPerfil(i, o, k)).join('');
      msg.innerHTML = `Guardado. Llevas ${aportes().correcciones.length} correcci${aportes().correcciones.length === 1 ? 'ón' : 'ones'}. <a href="#aportes">Ver y descargar mis aportes</a>`;
      return;
    }
    const cal = ev.target.closest('[data-veredicto]');
    if (cal) {
      const activo = calificar(sust.ej, +cal.dataset.alt, sust.art, sust.perfil, cal.dataset.veredicto, +cal.dataset.sim, cal.dataset.misma === '1');
      cal.parentElement.querySelectorAll('[data-veredicto]').forEach(b => b.setAttribute('aria-pressed', String(activo && b === cal)));
    }
  });

  // Arranque
  S.aportes = sanearAportes(S.aportes);
  leerHash();
})();
</script>
