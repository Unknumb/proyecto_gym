<title>Sustituto Seguro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de una columna con barra de pestañas fija (abajo en móvil, arriba en escritorio).
   Tema oscuro deliberado: sala de entrenamiento de noche, teal clínico del proyecto + ámbar de esfuerzo. */
:root {
  --bg: #0A1114;
  --surface: #111B1F;
  --surface-2: #172429;
  --line: #22353A;
  --fg: #E6EEF0;
  --muted: #8FA4A9;
  --accent: #3CC0B2;
  --accent-ink: #062521;
  --accent-soft: #123430;
  --amber: #EBA845;
  --amber-soft: #3A2C14;
  --veto: #F07A6E;
  --veto-soft: #3C1D1A;
  --ok: #62CC8E;
  --display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --tabbar: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--fg); font-family: var(--body); font-size: 1rem; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(var(--tabbar) + 24px + env(safe-area-inset-bottom, 0px));
}
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 900px; margin: 0 auto; padding-block: 20px 24px; }
.vista { display: grid; gap: 22px; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.eyebrow { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); }
.num-tab { font-variant-numeric: tabular-nums; }

/* Barra de pestañas */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: center;
}
nav.tabs .in { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; max-width: 720px; }
nav.tabs a {
  display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px;
  color: var(--muted); text-decoration: none; font-size: 0.74rem; font-weight: 600;
}
nav.tabs a svg { width: 22px; height: 22px; }
nav.tabs a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
@media (min-width: 760px) {
  body { padding-bottom: 32px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
  nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
  nav.tabs .in { grid-template-columns: repeat(5, auto); justify-content: center; gap: 6px; }
  nav.tabs a { grid-auto-flow: column; gap: 8px; padding: 8px 14px; font-size: 0.92rem; }
  nav.tabs a svg { width: 18px; height: 18px; }
}

/* Componentes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.card.plain { background: transparent; border-style: dashed; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 16px; font-weight: 600;
  text-decoration: none; color: var(--fg);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--veto); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 0.95rem;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip.veto[aria-pressed="true"] { background: var(--veto-soft); border-color: var(--veto); color: var(--veto); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; }
.chip[aria-pressed="true"] .dot { background: currentColor; }
.pill { font-size: 0.78rem; border-radius: 999px; padding: 2px 10px; white-space: nowrap; height: fit-content; font-weight: 600; }
.pill.teal { background: var(--accent-soft); color: var(--accent); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.red { background: var(--veto-soft); color: var(--veto); }
.aviso { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 12px 14px; font-size: 0.94rem; }
.aviso.amber { background: var(--amber-soft); } .aviso.amber b { color: var(--amber); }
.aviso.red { background: var(--veto-soft); } .aviso.red b { color: var(--veto); }
.aviso.teal { background: var(--accent-soft); } .aviso.teal b { color: var(--accent); }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .lbl { font-weight: 600; font-size: 0.93rem; }
.field input, .field select, textarea {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2);
}
.field input:focus, .field select:focus, textarea:focus { border-color: var(--accent); outline: none; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface-2); gap: 2px; }
.seg button { border: 0; background: none; padding: 7px 13px; border-radius: 7px; cursor: pointer; font-size: 0.93rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* Inicio */
.hero { display: grid; gap: 12px; padding-top: 8px; }
.hero h1 { font-size: clamp(2.1rem, 7vw, 3.4rem); line-height: 1.02; font-weight: 700; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lead { color: var(--muted); max-width: 58ch; font-size: 1.08rem; }
.entradas { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.entrada {
  display: grid; gap: 8px; align-content: start; padding: 18px; border-radius: 14px; text-decoration: none; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); transition: border-color .15s, transform .15s;
}
.entrada:hover { border-color: var(--accent); transform: translateY(-2px); }
.entrada .ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.entrada h3 { font-size: 1.15rem; }
.entrada p { color: var(--muted); font-size: 0.94rem; }
.resumen-inicio { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 2px; }
.kpi .v { font-family: var(--display); font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 0.85rem; }

/* Sustituir */
.buscador { position: relative; }
.buscador input { width: 100%; font-size: 1.05rem; padding: 13px 14px 13px 42px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); }
.buscador input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.buscador svg { position: absolute; left: 14px; top: 24px; transform: translateY(-50%); color: var(--muted); }
.sugerencias { list-style: none; margin: 6px 0 0; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: grid; max-height: 320px; overflow-y: auto; }
.sugerencias button { width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
.sugerencias button:hover, .sugerencias button[aria-selected="true"] { background: var(--accent-soft); }
.sugerencias .meta { color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.sugerencias .vacio { padding: 10px; color: var(--muted); }
.nombre { text-transform: none; }
.nombre .en { display: block; font-family: var(--body); font-weight: 400; color: var(--muted); font-size: 0.82rem; text-transform: capitalize; letter-spacing: 0; }
.ficha-h h3 { font-size: 1.4rem; overflow-wrap: anywhere; }
.datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 20px; margin: 0; }
.dato { min-width: 0; }
.dato dt { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.dato dd { margin: 2px 0 0; }
.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: alt; }
.alt { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 2.2rem 1fr; gap: 4px 12px; counter-increment: alt; }
.alt::before { content: counter(alt); grid-row: 1 / span 3; font-family: var(--display); font-weight: 700; font-size: 1.5rem; color: var(--accent); line-height: 1.2; }
.alt-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; min-width: 0; }
.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-weight: 600; font-size: 1.06rem; min-width: 0; overflow-wrap: anywhere; color: var(--fg); }
.linkbtn:hover { color: var(--accent); }
.alt-pie { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; min-width: 0; font-size: 0.9rem; }
.parecido { display: inline-flex; gap: 3px; align-items: center; color: var(--muted); }
.parecido i { width: 7px; height: 12px; border-radius: 2px; background: var(--line); }
.parecido i.on { background: var(--accent); }
.porque { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; color: var(--fg); }

/* Rutina */
.pasos-form { display: grid; gap: 18px; }
.dia { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.dia-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; padding: 14px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.dia-h h3 { font-size: 1.15rem; }
.ejs { list-style: none; margin: 0; padding: 0; }
.ej { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: center; }
.ej:last-child { border-bottom: 0; }
.ej .pres { font-family: var(--mono); font-size: 0.85rem; color: var(--amber); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ej .sub { grid-column: 1 / -1; color: var(--muted); font-size: 0.86rem; }
.ej.extra { background: color-mix(in srgb, var(--amber-soft) 45%, transparent); }
.notas-rutina { display: grid; gap: 8px; padding-left: 1.1rem; margin: 0; color: var(--muted); }
.notas-rutina b { color: var(--fg); }
.ia { border: 1px solid var(--accent); background: linear-gradient(160deg, var(--accent-soft), var(--surface) 60%); }
.ia-out { white-space: pre-wrap; line-height: 1.55; }
.cambio { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.cambio input { margin-top: 5px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }

/* Entrenar */
.serie { display: grid; grid-template-columns: 2rem 1fr 1fr 2.8rem; gap: 8px; align-items: center; }
.serie .n { font-family: var(--mono); color: var(--muted); font-size: 0.85rem; }
.serie input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface-2); text-align: center; font-variant-numeric: tabular-nums; }
.serie input:focus { border-color: var(--accent); outline: none; }
.check { width: 2.8rem; height: 2.4rem; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface-2); cursor: pointer; display: grid; place-items: center; }
.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #062014; }
.serie.hecha input { color: var(--muted); }
.serie-h { display: grid; grid-template-columns: 2rem 1fr 1fr 2.8rem; gap: 8px; font-family: var(--mono); font-size: 0.7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; }
.barra-prog { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.barra-prog i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.timer {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px)); z-index: 25;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--amber); color: #241703; display: flex; justify-content: center;
}
.timer .in { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; width: 100%; max-width: 860px; }
.timer .t { font-family: var(--mono); font-size: 1.6rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.timer button { border: 1.5px solid #241703; background: transparent; color: #241703; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 700; }
@media (min-width: 760px) { .timer { bottom: 0; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); } }
input[type=range] { width: 100%; accent-color: var(--accent); }
.slider-row { display: grid; grid-template-columns: minmax(110px, 1fr) 2fr 2.4rem; gap: 10px; align-items: center; }
.slider-row output { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

/* Progreso */
.graf { width: 100%; height: auto; display: block; }
.graf text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
.historial { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.historial li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--muted); }
.leyenda span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: -1px; }

/* Cómo funciona */
.como-pasos { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: p; }
.como-pasos li { display: grid; grid-template-columns: 2.4rem 1fr; gap: 4px 14px; counter-increment: p; }
.como-pasos li::before { content: counter(p); grid-row: 1 / span 2; width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--accent); color: var(--accent); font-family: var(--mono); font-size: 0.9rem; }
.como-pasos h3 { font-size: 1.08rem; }
.como-pasos p { color: var(--muted); }
details { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 16px; }
details summary { cursor: pointer; padding: 14px 0; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details summary::after { content: "+"; color: var(--accent); font-family: var(--mono); }
details[open] summary::after { content: "–"; }
details > div { padding-bottom: 14px; color: var(--muted); display: grid; gap: 8px; }
footer { color: var(--muted); font-size: 0.84rem; display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 18px; margin-top: 28px; }

@media (max-width: 480px) {
  .card { padding: 14px; }
  .alt { grid-template-columns: 1.6rem 1fr; padding: 12px; }
  .ej { grid-template-columns: 1fr; }
  .ej .pres { text-align: left; }
  .slider-row { grid-template-columns: 1fr 2.4rem; }
  .slider-row label { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  function ajustesPorPerfil(p) {

  }
  const REGLAS_IA = 'Eres un entrenador personal prudente que responde en español de Chile, claro y cercano, sin jerga. No haces diagnósticos médicos, no das dietas ni metas de calorías o de peso corporal, y ante dolor recomiendas consultar a un kinesiólogo o médico. Nunca sugieras ejercicios que carguen las zonas lesionadas.';
  let iaCtl = null;

  function validarIA(res) {

      const e = r.dias[d]?.ejercicios[pos];
      if (!e || !e.alternativas.includes(nuevo) || !esSeguro(nuevo, vet)) continue; // solo cambios a alternativas ya validadas
      cambios.push({ d, pos, de: e.i, a: nuevo, motivo: txt(c.motivo, 200) });

  // ═══════════════ ENTRENAR ═══════════════
  let timerInt = null, timerFin = 0;
  function iniciarDescanso(seg) {

    const pintar = () => {
      const rest = Math.max(0, Math.round((timerFin - Date.now()) / 1000));
      t.innerHTML = `<div class="in"><span>Descanso</span><span class="t" role="timer" aria-live="off">${Math.floor(rest / 60)}:${String(rest % 60).padStart(2, '0')}</span>

      t.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { if (b.dataset.t === '0') return pararDescanso(); timerFin += 30000; pintar(); });
      if (rest === 0) { pararDescanso(); try { navigator.vibrate?.(200); } catch (_) {} }

    const alerta = () => {
      const max = Math.max(0, ...Object.values(s.dolor));
      $('alerta-dolor').innerHTML = max >= 7 ? '<div class="aviso red"><p><b>Dolor alto.</b> No sigas entrenando esa zona y consulta a un kinesiólogo o médico antes de la próxima sesión.</p></div>'
        : max >= 4 ? '<div class="aviso amber"><p><b>Dolor moderado.</b> En la próxima sesión baja el peso o cambia el ejercicio que lo provocó. Si persiste, consulta.</p></div>' : '';
    };
    alerta();
    $('r-esf').oninput = ev => { s.esfuerzo = +ev.target.value; $('o-esf').textContent = s.esfuerzo; };
    app.querySelectorAll('[data-dolor]').forEach(r => r.oninput = () => { s.dolor[r.dataset.dolor] = +r.value; r.nextElementSibling.textContent = r.value; alerta(); });
    $('r-notas').oninput = ev => { s.notas = ev.target.value.slice(0, 500); };
    $('volver').onclick = () => { s.finalizando = false; guardar(); vEntrenar(); };
    $('guardar-ses').onclick = () => {
      const min = Math.max(1, Math.round((Date.now() - s.inicio) / 60000));
      S.sesiones.push({ fecha: hoyISO(), dia: s.dia, titulo: S.rutina.dias[s.dia]?.titulo || '', minutos: Math.min(min, 300), esfuerzo: s.esfuerzo,
        dolor: s.dolor, notas: s.notas || '', ejercicios: s.ejercicios.map(e => ({ i: e.i, series: e.series.filter(x => x.hecho).map(x => ({ kg: x.kg === '' ? null : x.kg, reps: x.reps })) })).filter(e => e.series.length) });
      S.enCurso = null; guardar(); location.hash = 'progreso';
    };
  }

  // ═══════════════ PROGRESO ═══════════════
  function grafBarras(valores, etiquetas, meta) {
    const W = 560, H = 180, pl = 26, pb = 22, pt = 10, max = Math.max(meta || 0, ...valores, 1);
    const bw = (W - pl) / valores.length;
    const y = v => pt + (H - pt - pb) * (1 - v / max);
    let s = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sesiones por semana">`;
    for (let v = 0; v <= max; v += Math.max(1, Math.ceil(max / 4))) s += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
    if (meta) s += `<line x1="${pl}" x2="${W}" y1="${y(meta)}" y2="${y(meta)}" stroke="var(--amber)" stroke-dasharray="4 4"/>`;
    valores.forEach((v, k) => {
      const x = pl + k * bw + bw * 0.18, w = bw * 0.64;
      s += `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0, H - pb - y(v))}" rx="3" fill="${k === valores.length - 1 ? 'var(--accent)' : 'color-mix(in srgb, var(--accent) 55%, var(--surface))'}"/>`;
      s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${etiquetas[k]}</text>`;
    });
    return s + '</svg>';
  }
  function grafLineas(series, etiquetasX, { yMax, sufijo = '' } = {}) {
    const W = 560, H = 190, pl = 34, pr = 10, pb = 22, pt = 12;
    const todos = series.flatMap(s => s.valores.filter(v => v !== null));
    if (!todos.length) return '';
    const mx = yMax ?? Math.max(...todos) * 1.1, mn = yMax !== undefined ? 0 : Math.min(...todos) * 0.9;
    const n = etiquetasX.length;
    const x = k => pl + (n === 1 ? (W - pl - pr) / 2 : k * (W - pl - pr) / (n - 1));
    const y = v => pt + (H - pt - pb) * (1 - (v - mn) / ((mx - mn) || 1));
    let s = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img">`;
    for (let t = 0; t <= 4; t++) { const v = mn + (mx - mn) * t / 4; s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${Math.round(v * 10) / 10}${sufijo}</text>`; }
    const paso = Math.max(1, Math.ceil(n / 6));
    etiquetasX.forEach((e, k) => { if (k % paso === 0 || k === n - 1) s += `<text x="${x(k)}" y="${H - 6}" text-anchor="middle">${e}</text>`; });
    for (const se of series) {
      const pts = se.valores.map((v, k) => v === null ? null : [x(k), y(v)]).filter(Boolean);
      if (pts.length > 1) s += `<polyline fill="none" stroke="${se.color}" stroke-width="2.2" stroke-linejoin="round" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
      pts.forEach((p, k) => s += `<circle cx="${p[0]}" cy="${p[1]}" r="${k === pts.length - 1 ? 4.5 : 3}" fill="${se.color}"/>`);
    }
    return s + '</svg>';
  }
  const COLORES = ['var(--veto)', 'var(--amber)', 'var(--accent)', '#9C8CF0', '#6FB4F0', '#F08CC8', 'var(--ok)', '#C9C26A'];
  const corto = iso => { const d = new Date(iso + 'T12:00:00'); return d.getDate() + '/' + (d.getMonth() + 1); };
  let ejProgreso = null, confirmarBorrar = null, msgDatos = '';
  function vProgreso() {
    const st = estadisticas(), ses = S.sesiones;
    const sems = semanas(8);
    const porSem = sems.map(w => ses.filter(s => lunes(s.fecha) === w).length);
    const les = [...new Set(ses.flatMap(s => Object.keys(s.dolor || {})))].filter(k => LES[k]);
    const conDolor = ses.filter(s => s.dolor && Object.keys(s.dolor).length).slice(-12);
    const ejsReg = [...new Set(ses.flatMap(s => s.ejercicios.filter(e => e.series.some(x => x.kg)).map(e => e.i)))];
    if (!ejsReg.includes(ejProgreso)) ejProgreso = ejsReg[0] ?? null;
    const cargas = ejProgreso === null ? [] : ses.filter(s => s.ejercicios.some(e => e.i === ejProgreso && e.series.some(x => x.kg))).slice(-12)
      .map(s => ({ fecha: s.fecha, kg: Math.max(...s.ejercicios.find(e => e.i === ejProgreso).series.map(x => +x.kg || 0)) }));
    // Alerta de tendencia de dolor
    const alertas = [];
    for (const k of les) {
      const v = ses.filter(s => s.dolor && s.dolor[k] !== undefined).map(s => s.dolor[k]);
      if (!v.length) continue;
      const ult = v[v.length - 1], prev = v.slice(-4, -1);
      const prom = prev.length ? prev.reduce((a, b) => a + b, 0) / prev.length : null;
      if (ult >= 7) alertas.push(['red', `${LES[k].nombre}: dolor alto (${ult}/10) en la última sesión.`, 'Pausa los ejercicios de esa zona y consulta a un profesional.']);
      else if (prom !== null && ult - prom >= 2) alertas.push(['amber', `${LES[k].nombre}: el dolor está subiendo.`, 'Baja la carga o cambia los ejercicios que lo provocan. Si sigue subiendo, consulta.']);
      else if (prom !== null && prom - ult >= 2) alertas.push(['teal', `${LES[k].nombre}: el dolor va bajando.`, 'Buena señal. Sigue progresando de a poco.']);
    }
    app.innerHTML = `<div class="vista">
      <header class="hero" style="padding-top:0"><div class="eyebrow">Progreso</div><h1 style="font-size:clamp(1.8rem,5vw,2.4rem)">Tu avance</h1>
        <p class="lead">Se guarda en este dispositivo y navegador.${almacenOK ? '' : ' <b style="color:var(--veto)">Este navegador no permite guardar datos: tu progreso se perderá al cerrar.</b>'}</p></header>
      <section class="resumen-inicio">
        <div class="kpi"><span class="v num-tab">${st.estaSemana}/${st.objetivo}</span><span class="l">Sesiones esta semana</span></div>
        <div class="kpi"><span class="v num-tab">${st.racha}</span><span class="l">Semanas seguidas</span></div>
        <div class="kpi"><span class="v num-tab">${st.total}</span><span class="l">Sesiones en total</span></div>
        <div class="kpi"><span class="v num-tab">${ses.length ? Math.round(ses.reduce((a, s) => a + (s.esfuerzo || 0), 0) / ses.length * 10) / 10 : '—'}</span><span class="l">Esfuerzo promedio (1–10)</span></div>
      </section>
      ${alertas.map(([c, b, t]) => `<div class="aviso ${c}"><p><b>${esc(b)}</b> ${esc(t)}</p></div>`).join('')}
      ${!ses.length ? `<div class="card plain"><h3>Aún no hay sesiones</h3><p class="muted">Cuando termines tu primer entrenamiento aquí verás tu constancia, tus cargas y cómo evoluciona el dolor.</p><div class="row"><a class="btn primary" href="#${S.rutina ? 'entrenar' : 'rutina'}">${S.rutina ? 'Entrenar ahora' : 'Crear mi rutina'}</a></div></div>` : ''}
      <section class="card"><div class="row" style="justify-content:space-between"><h3>Constancia</h3><span class="leyenda"><span style="--c:var(--amber)">Meta: ${st.objetivo} por semana</span></span></div>
        ${grafBarras(porSem, sems.map(corto), st.objetivo)}<p class="muted small">Sesiones por semana, últimas 8 semanas (la fecha es el lunes).</p></section>
      ${conDolor.length && les.length ? `<section class="card"><h3>Dolor por zona</h3>
        <div class="leyenda">${les.map((k, n) => `<span style="--c:${COLORES[n % COLORES.length]}">${esc(LES[k].nombre)}</span>`).join('')}</div>
        ${grafLineas(les.map((k, n) => ({ color: COLORES[n % COLORES.length], valores: conDolor.map(s => s.dolor[k] ?? null) })), conDolor.map(s => corto(s.fecha)), { yMax: 10 })}
        <p class="muted small">Escala 0 a 10, últimas sesiones. Lo ideal es que se mantenga bajo 3.</p></section>` : ''}
      ${ejsReg.length ? `<section class="card"><div class="row" style="justify-content:space-between"><h3>Carga por ejercicio</h3>
          <select id="sel-ej" aria-label="Ejercicio" style="padding:8px 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface-2);max-width:100%">${ejsReg.map(i => `<option value="${i}" ${i === ejProgreso ? 'selected' : ''}>${esc(nombreTxt(i))}</option>`).join('')}</select></div>
        ${grafLineas([{ color: 'var(--accent)', valores: cargas.map(c => c.kg) }], cargas.map(c => corto(c.fecha)), { sufijo: '' })}
        <p class="muted small num-tab">Kilos de la serie más pesada en cada sesión.${cargas.length > 1 ? ` Cambio: ${(cargas[cargas.length - 1].kg - cargas[0].kg) >= 0 ? '+' : ''}${Math.round((cargas[cargas.length - 1].kg - cargas[0].kg) * 10) / 10} kg.` : ''}</p></section>` : ''}
      <section class="card"><h3>Peso corporal</h3>
        <form id="f-pesaje" class="row"><div class="field" style="max-width:160px"><label for="p-kg" class="small">Registrar hoy (kg)</label><input id="p-kg" type="number" inputmode="decimal" min="30" max="250" step="0.1"></div><button class="btn" type="submit" style="align-self:end">Guardar</button></form>
        ${S.pesos.length > 1 ? grafLineas([{ color: 'var(--amber)', valores: S.pesos.slice(-15).map(p => p.kg) }], S.pesos.slice(-15).map(p => corto(p.fecha))) : `<p class="muted small">${S.pesos.length ? 'Registra otro día para ver la evolución.' : 'Opcional. Útil si quieres seguir tu peso junto al entrenamiento.'}</p>`}
      </section>
      ${ses.length ? `<section style="display:grid;gap:10px"><h3>Historial</h3><ul class="historial">${ses.slice().reverse().slice(0, 20).map((s, n) => {
        const idx = ses.length - 1 - n;
        const vol = s.ejercicios.reduce((a, e) => a + e.series.length, 0);
        return `<li><div><b>${esc(cap(fechaLarga(s.fecha)))}</b> · ${esc(s.titulo)}<br><span class="muted small num-tab">${s.ejercicios.length} ejercicios · ${vol} series · ${s.minutos} min · esfuerzo ${s.esfuerzo}/10${Object.keys(s.dolor || {}).length ? ' · dolor ' + Object.entries(s.dolor).map(([k, v]) => `${LES[k]?.nombre.toLowerCase()} ${v}`).join(', ') : ''}</span>${s.notas ? `<br><span class="small">${esc(s.notas)}</span>` : ''}</div>
          ${confirmarBorrar === idx ? `<span class="row" style="gap:6px"><button class="btn danger" type="button" data-borrar-si="${idx}">Borrar</button><button class="btn ghost" type="button" data-borrar-no>Cancelar</button></span>` : `<button class="btn ghost small" type="button" data-borrar="${idx}" aria-label="Borrar sesión">Borrar</button>`}</li>`;
      }).join('')}</ul></section>` : ''}
      <section class="card plain"><h3>Respaldo de tus datos</h3><p class="muted small">Tu progreso vive solo en este navegador. Guarda un respaldo para no perderlo o para pasarlo a otro dispositivo.</p>
        <div class="row">${DESC ? '<button class="btn" type="button" id="exportar">Guardar respaldo</button>' : ''}<label class="btn" for="importar" style="cursor:pointer">Cargar respaldo</label><input id="importar" type="file" accept="application/json,.json" hidden></div>
        <p class="small" id="msg-datos" aria-live="polite">${esc(msgDatos)}</p></section>
    </div>`;
    msgDatos = '';
    $('sel-ej')?.addEventListener('change', ev => { ejProgreso = +ev.target.value; vProgreso(); });
    $('f-pesaje').addEventListener('submit', ev => {
      ev.preventDefault(); const kg = parseFloat($('p-kg').value);
      if (!(kg >= 30 && kg <= 250)) { $('p-kg').focus(); return; }
      const hoy = hoyISO(); S.pesos = S.pesos.filter(p => p.fecha !== hoy).concat({ fecha: hoy, kg }).sort((a, b) => a.fecha.localeCompare(b.fecha)); guardar(); vProgreso();
    });
    app.querySelectorAll('[data-borrar]').forEach(b => b.onclick = () => { confirmarBorrar = +b.dataset.borrar; vProgreso(); });
    app.querySelectorAll('[data-borrar-no]').forEach(b => b.onclick = () => { confirmarBorrar = null; vProgreso(); });
    app.querySelectorAll('[data-borrar-si]').forEach(b => b.onclick = () => { S.sesiones.splice(+b.dataset.borrarSi, 1); confirmarBorrar = null; guardar(); vProgreso(); });
    $('exportar')?.addEventListener('click', async () => {
      try { await DESC.save({ filename: `sustituto-seguro-respaldo-${hoyISO()}.json`, data: JSON.stringify(S, null, 1) }); msgDatos = 'Respaldo guardado.'; }
      catch (e) { msgDatos = e?.code === 'cancelled' || e?.code === 'declined' ? 'No se guardó el respaldo.' : 'No se pudo guardar el respaldo en este navegador.'; }
      $('msg-datos').textContent = msgDatos; msgDatos = '';
    });
    $('importar').addEventListener('change', ev => {
      const f = ev.target.files?.[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const x = JSON.parse(rd.result);
          if (!x || !Array.isArray(x.sesiones)) throw new Error('formato');
          S = { perfil: x.perfil || null, rutina: x.rutina || null, sesiones: x.sesiones, pesos: Array.isArray(x.pesos) ? x.pesos : [], enCurso: null };
          guardar(); msgDatos = `Respaldo cargado: ${S.sesiones.length} sesiones.`;
        } catch (_) { msgDatos = 'Ese archivo no es un respaldo válido de esta aplicación.'; }
        vProgreso();
      };
      rd.readAsText(f);
    });
  }

  // ═══════════════ CÓMO FUNCIONA ═══════════════
  function vComo() {
    app.innerHTML = `<div class="vista">
      <header class="hero" style="padding-top:0"><div class="eyebrow">Cómo funciona</div><h1 style="font-size:clamp(1.8rem,5vw,2.6rem)">Seguridad primero, y después todo lo demás</h1>
        <p class="lead">Esta aplicación nace de un proyecto de Machine Learning que modela cada ejercicio por su mecánica: qué músculos trabaja y qué articulaciones carga. Así puede evitar la zona lesionada sin dejar de entrenar el músculo.</p></header>
      <section class="card"><h3>Cómo usarla</h3>
        <ol class="como-pasos">
          <li><h3>Arma tu rutina</h3><p>Ingresa edad, peso, deporte, nivel, días, minutos, equipamiento y lesiones. La rutina se crea al instante.</p></li>
          <li><h3>Ajústala</h3><p>Cambia un ejercicio por otra opción segura con un toque, genera otra variante o, si tienes cuenta de Claude, pídele a la IA que la revise.</p></li>
          <li><h3>Entrena con la app</h3><p>Elige el día, anota peso y repeticiones, marca cada serie y descansa con el cronómetro.</p></li>
          <li><h3>Registra cómo te sentiste</h3><p>Al terminar anotas el esfuerzo y el dolor de cada zona lesionada. Si sube, la app te avisa.</p></li>
          <li><h3>Mira tu progreso</h3><p>Constancia semanal, cargas por ejercicio, dolor y peso corporal en gráficos.</p></li>
        </ol></section>
      <section style="display:grid;gap:10px"><h3>Preguntas frecuentes</h3>
        <details open><summary>¿Cómo sabe qué ejercicio es seguro?</summary><div>
          <p>Cada ejercicio tiene registrados sus músculos principales y de apoyo, y cada músculo las articulaciones que cruza. Si un ejercicio carga una articulación que marcaste, queda fuera. Es un filtro estricto: no importa qué tan bueno sea el ejercicio.</p>
          <p>Para lesiones usamos un criterio conservador. Por ejemplo, si marcas muñeca también evitamos los ejercicios que cargan el antebrazo, y si marcas zona lumbar evitamos los que cargan la espalda media.</p></div></details>
        <details><summary>¿Por qué a veces me cambia el músculo?</summary><div>
          <p>Algunos músculos cruzan la articulación lesionada. El cuádriceps cruza la rodilla: no existe forma de trabajarlo sin cargarla. En esos casos mantenemos los músculos que sí se pueden trabajar (por ejemplo, glúteos) y te lo explicamos.</p>
          <p>Si ningún músculo principal se puede conservar, la aplicación no recomienda nada y te sugiere consultar a un kinesiólogo, en vez de inventar una alternativa.</p></div></details>
        <details><summary>¿Cómo se ordenan las alternativas?</summary><div>
          <p>Primero las del mismo tipo de movimiento (empuje, tracción, estiramiento). Después por parecido biomecánico, calculado con un grafo que conecta ejercicios, músculos y articulaciones (técnica Node2Vec, agrupada en 12 familias de movimiento). Si ninguna opción se hace con peso corporal, se agrega una al final para quien entrena en casa.</p></div></details>
        <details><summary>¿Cómo se arma la rutina?</summary><div>
          <p>Según los días: 2–3 días, cuerpo completo; 4 días, torso y piernas; 5–6 días, empuje, tracción y piernas. Los minutos definen cuántos ejercicios entran. El objetivo define series, repeticiones y descanso.</p>
          <p>La edad ajusta la dificultad: con menos de 18 años se evitan series de muy pocas repeticiones; con 60 o más se evitan saltos y se suma equilibrio. El peso y la altura sirven para decidir si conviene empezar sin ejercicios de impacto. El deporte agrega ejercicios complementarios.</p></div></details>
        <details><summary>¿Qué hace la IA?</summary><div>
          <p>Revisa tu rutina, te explica por qué sirve, da consejos y propone cambios. Solo puede elegir entre ejercicios que ya pasaron el filtro de seguridad, y tú decides si aplicarlos. También puedes hacerle preguntas sobre tu entrenamiento.</p>
          <p>Funciona con tu propia cuenta de Claude y te pide permiso la primera vez. Si no tienes cuenta, el resto de la aplicación funciona igual.</p></div></details>
        <details><summary>¿Dónde quedan mis datos?</summary><div>
          <p>En tu navegador, en este dispositivo. No hay cuentas ni servidor que los guarde. Si borras los datos del navegador o cambias de teléfono, se pierden: usa “Guardar respaldo” en la sección Progreso.</p></div></details>
        <details><summary>¿Qué tan confiable es?</summary><div>
          <p>Con 2.461 ejercicios de tres fuentes abiertas, el sistema encuentra al menos 3 alternativas para el 89 % de los ejercicios que se pueden sustituir. En rodilla y hombro la cobertura es menor. Los nombres en español están revisados para los ejercicios más comunes; el resto aparece con su nombre original en inglés.</p>
          <p>Es una herramienta informativa basada en datos: no conoce tu lesión en detalle. Un kinesiólogo siempre tiene la última palabra.</p></div></details>
      </section>
      <div class="row"><a class="btn primary" href="#rutina">Crear mi rutina</a><a class="btn" href="#sustituir">Sustituir un ejercicio</a></div>
    </div>`;
  }

  // Arranque
  leerHash();
})();
</script>
