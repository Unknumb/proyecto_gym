# Proyecto de Xcode de la app Sustituto Seguro. Se genera con:
#   cd ios/SustitutoSeguro && xcodegen generate
# y se abre SustitutoSeguro.xcodeproj. Para instalarla en un iPhone hay que elegir
# un equipo de firma (Signing & Capabilities → Team: tu Apple ID).
name: SustitutoSeguro
options:
  bundleIdPrefix: cl.unknumb
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
packages:
  SustitutoSeguroCore:
    path: ../SustitutoSeguroCore
targets:
  SustitutoSeguro:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Recursos
        type: folder
        buildPhase: resources
      # Las recomendaciones precalculadas son las mismas de la web: un solo archivo.
      - path: ../../web/datos_web.json
        buildPhase: resources
    dependencies:
      - package: SustitutoSeguroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.unknumb.sustitutoseguro
        PRODUCT_NAME: Sustituto Seguro
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sustituto Seguro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Los CSV exportados se pueden ver en la app Archivos.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
schemes:
  SustitutoSeguro:
    build:
      targets:
        SustitutoSeguro: all
    run:
      config: Debug
    archive:
      config: Release
